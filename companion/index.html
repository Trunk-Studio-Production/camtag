<script>
// ============================================================================
// Costanti e stato
// ============================================================================
const DEVICES = { x3: { w: 792, h: 528 } };
// Tipografia delle schermate: Inter, e soglia a metà per portare il testo a 1 bit.
const FONT = '"Inter", sans-serif';
const TEXT_T = 128;
const STORE_KEY = 'camtag.project.v1';
const LENS_ROWS_PER_PAGE = 11;
// Fasce libere sui lati corti (dove stanno i tasti) per le indicazioni del firmware.
const STRIP = { port: 40, land: 64 };
// Posizione dei tasti A, B, C, D lungo il bordo inferiore (verticale), in frazione di larghezza.
const KEY_POS = { A: 0.14, B: 0.44, C: 0.57, D: 0.86 };

const ND_VALUES = [0.3, 0.6, 0.9, 1.2, 1.5, 1.8, 2.1, 2.4];
const DIOPTERS = [0.25, 0.5, 1, 2, 3, 4];
const DIO_LABEL = { 0.25: '+1/4', 0.5: '+1/2', 1: '+1', 2: '+2', 3: '+3', 4: '+4' };
const LENS_TYPES = { prime: 'Prime', macro: 'Macro', zoom: 'Zoom', anamorphic: 'Anamorfico', probe: 'Probe', specialty: 'Speciale' };

const DEFAULTS = {
  lens:  () => ({ formats: 'both', type: 'lens', brand: 'MARCA', series: 'Serie', focal: '35', tstop: '1.8', mod: '0.35 m', front: '95 mm', thread: '', notes: '' }),
  crew:  () => ({ formats: 'both', type: 'crew', title: 'CAMERA DEPT', lines: 'DOP: Nome Cognome\n1st AC: Nome Cognome\n2nd AC: Nome Cognome\nDIT: Nome Cognome\nGaffer: Nome Cognome' }),
  notes: () => ({ formats: 'both', type: 'notes', title: 'NOTE', body: 'CH 1 Camera\nCH 2 Elettrici\n\nScena 12 — Steadicam' }),
  patch: () => ({ formats: 'both', type: 'patch', img: null, fit: 'contain', dither: 'atkinson', threshold: 128, invert: false, caption: '' }),
};
const TYPE_LABEL = { lens: 'Lente', crew: 'Crew', notes: 'Note', patch: 'Patch' };

function freshState() {
  return {
    version: 6, device: 'x3', production: '', lensSplit: false, lensFront: true,
    auto: { lenschart: true, filters: true },
    lenses: [],
    filters: { ndFormat: 'density', ndType: 'ND', nd: [0.3, 0.6, 0.9, 1.2, 1.5, 1.8], ndCombos: [], dio: [], effects: [], stages: [null, null, null], previewNd: 0, previewDio: 0 },
    cards: [DEFAULTS.crew()],
  };
}

function migrate(s) {
  if (!s || !Array.isArray(s.cards)) return s;
  for (const c of s.cards) { if (!c.formats) c.formats = 'both'; delete c.orient; delete c.mount; }
  const f = freshState(), hadStages = Array.isArray(s.filters?.stages);
  for (const k of ['production', 'lensSplit', 'lensFront', 'auto', 'lenses', 'filters']) if (s[k] === undefined) s[k] = f[k];
  s.filters = Object.assign(f.filters, s.filters);
  if ('ir' in s.filters) { if (s.filters.ir) s.filters.ndType = 'IRND'; delete s.filters.ir; }  // vecchia casella IRND
  // Vecchi "filtri di stile" (un elemento per filtro montato) -> kit con gradazioni montate.
  if (Array.isArray(s.filters.style)) {
    for (const o of s.filters.style) addToKit(s.filters, null, o.name, [o.strength || ''], [o.strength || '']);
    delete s.filters.style;
  }
  // v4: i vetri non sono più "montati" nel kit, stanno negli stadi del mattebox.
  if (!hadStages) {
    const on = s.filters.effects.flatMap(e => e.strengths.filter(x => x.on).map(x => glassKey(e, x.s)));
    const st = [...(s.filters.previewNd > 0 && s.filters.nd.length ? [null] : []), ...on].slice(0, MAX_STAGES);  // lo stadio 1 è dell'ND
    s.filters.stages = [...st, ...Array(Math.max(0, 3 - st.length)).fill(null)];
  }
  for (const e of s.filters.effects) for (const x of e.strengths) delete x.on;
  normalizeStages(s.filters);  // i vetri vanno al loro posto dopo, con lo stato pronto (fitStart)
  // v6: font, soglia del testo e separatore decimale non sono più opzioni (Inter, 128, punto).
  delete s.typo; delete s.decimal;
  s.device = 'x3'; s.version = 6;
  return s;
}

// Kit dei vetri (esclusi gli ND pieni): una voce per famiglia con le sue gradazioni.
// { id, name, strengths: [{ s: '1/4' }] }  — s '' = vetro senza gradazione.
// `mounted` serve solo a convertire i progetti vecchi (vedi migrate).
function addToKit(f, id, name, strengths, mounted = []) {
  let e = f.effects.find(x => (id && x.id === id) || (!id && !x.id && x.name === name));
  if (!e) { e = { id, name, strengths: [] }; f.effects.push(e); }
  for (const s of strengths.length ? strengths : ['']) {
    let x = e.strengths.find(y => y.s === s);
    if (!x) e.strengths.push(x = { s });
    if (mounted.includes(s)) x.on = true;
  }
  return e;
}
// Stadi del mattebox: filters.stages[i] = chiave del vetro che comincia nello
// stadio i+1 (1 = lato lente) oppure null. Un vetro sta in un posto solo; uno da
// due stadi (glassSlots, es. un Rota Pola) occupa anche lo stadio dopo, che resta null.
// L'ND, quando c'è, occupa i primi stadi (uno, o due per una coppia) e la diottria
// gli ultimi (due, o uno: dioSlots), davanti a tutto: lì stages[i] resta null e la
// riga mostra l'ND o la diottria. Ai vetri restano gli stadi in mezzo (stageRange).
// Qui ci sono i valori di partenza; il simulatore ne tiene una copia sua
// (sim.stages, sim.nd, sim.dio), come farà il dispositivo.
// Il selettore mostra gli stadi di un mattebox (BOX_STAGES); oltre, dietro un "+",
// ci sono quelli per un vetro montato fuori (caso raro), fino a MAX_STAGES.
const MAX_STAGES = 6, BOX_STAGES = 4;
function glassKey(e, s) { return `${e.id || 'c:' + e.name}|${s}`; }
// I vetri nell'ordine in cui si scorrono sul dispositivo (per famiglia).
// slots = stadi occupati: 1, oppure 2 se la famiglia è segnata così (e.slots).
function kitGlasses(f = state.filters) {
  return f.effects.flatMap(e => e.strengths.map(x => ({ key: glassKey(e, x.s), label: `${e.name}${x.s ? ' ' + x.s : ''}`, slots: e.slots === 2 ? 2 : 1 })));
}
// Una diottria occupa due stadi, uno solo se segnata così (d.slots === 1).
function dioSlots(d) { return d ? (d.slots === 1 ? 1 : 2) : 0; }
// Nella riga dello stadio la diottria porta il suo nome: "+1" da solo non si capirebbe.
function dioStageLabel(d) { return `Diottria ${dioLabel(d)}`; }
// Svuota gli stadi che puntano a un vetro tolto dal kit o già usato in un altro stadio.
function normalizeStages(f) {
  const keys = new Set(kitGlasses(f).map(g => g.key)), seen = new Set();
  f.stages = f.stages.slice(0, MAX_STAGES).map(k => (k && keys.has(k) && !seen.has(k) ? (seen.add(k), k) : null));
  if (!f.stages.length) f.stages = [null];
}
// Senza vetri nel kit la lista degli stadi non compare.
function stageCount() { return state.filters.effects.length ? state.filters.stages.length : 0; }
// Quanti stadi occupa l'ND a quel passo: 0 = nessuno, 1 = un vetro, 2 = una coppia.
function ndUsed(ndIdx = state.filters.previewNd) { return ndParts(ndSteps()[ndIdx] || 0).length; }
// Quanti ne occupa la diottria a quel passo: 0 = nessuna, poi 2 o 1.
function dioUsed(dioIdx = state.filters.previewDio) { return dioSlots(dioSteps()[dioIdx]); }
// Gli stadi per i vetri, su n: [lo, hi). Prima c'è l'ND, dopo la diottria. La
// diottria entra negli stadi solo se ci sta tutta dopo l'ND: altrimenti hi = n e
// resta soltanto nel riquadro grande.
function stageRange(n, ndIdx = state.filters.previewNd, dioIdx = state.filters.previewDio) {
  const lo = Math.min(n, ndUsed(ndIdx)), d = dioUsed(dioIdx);
  return { lo, hi: d && lo + d <= n ? n - d : n };
}
// Rimette i vetri negli stadi [lo, hi), in ordine e spostandoli il meno possibile:
// chi sta sotto l'ND scala verso il fronte, chi sta sotto la diottria (o oltre
// l'ultimo stadio) scala verso la lente, e gli spazi vuoti si chiudono solo quanto
// serve. Se non c'è posto per tutti escono i vetri più avanti, uno alla volta.
// back = stadi che l'ND ha liberato (da due a uno, o tolto): prima i vetri
// tornano indietro di altrettanti, così restano accanto all'ND.
// Restituisce { moved, out: [vetri usciti] }.
function fitStages(stages, lo, hi, back = 0, f = state.filters) {
  const size = new Map(kitGlasses(f).map(g => [g.key, g.slots])), old = [...stages], out = [], items = [];
  stages.forEach((k, i) => { if (k) items.push({ k, pos: i - back, n: size.get(k) || 1 }); });
  let p = [];
  for (;;) {
    p = items.map(it => it.pos);
    let cur = lo; items.forEach((it, j) => { p[j] = Math.max(p[j], cur); cur = p[j] + it.n; });
    cur = hi; for (let j = items.length - 1; j >= 0; j--) { p[j] = Math.min(p[j], cur - items[j].n); cur = p[j]; }
    if (!items.length || p[0] >= lo) break;
    out.push(items.pop().k);
  }
  stages.fill(null); items.forEach((it, j) => { stages[p[j]] = it.k; });
  return { moved: stages.some((k, i) => k !== old[i]), out };
}
// ND, diottria e vetri di partenza al loro posto (all'avvio e dopo un'importazione).
function fitStart() { const f = state.filters, { lo, hi } = stageRange(f.stages.length); fitStages(f.stages, lo, hi); }
// Testo dell'ND nella riga dello stadio 1 (il fattore porta già il tipo: "IRND8").
function ndStageLabel(v) { const f = state.filters; return f.ndFormat === 'factor' ? ndLabel(v) : `${f.ndType} ${ndLabel(v)}`; }
// Cosa c'è in ogni stadio: { kind, label, span } con kind 'nd', 'dio', 'glass'
// (più key) o 'empty'; span = stadi occupati. Lo stadio dopo, per chi ne occupa
// due, è { kind: 'cont', of: stadio in cui comincia }.
function stageCells(stages = state.filters.stages, ndIdx = state.filters.previewNd, dioIdx = state.filters.previewDio) {
  const n = stages.length, { lo, hi } = stageRange(n, ndIdx, dioIdx), kit = new Map(kitGlasses().map(g => [g.key, g]));
  const nd = ndParts(ndSteps()[ndIdx] || 0), cells = [];
  for (let i = 0, cont = 0; i < n; i++) {
    const g = i >= lo && i < hi && stages[i] ? kit.get(stages[i]) : null;
    if (i < lo) cells.push({ kind: 'nd', label: ndStageLabel(nd[i]), span: 1 });
    else if (i >= hi) cells.push(i === hi ? { kind: 'dio', label: dioStageLabel(dioSteps()[dioIdx]), span: n - hi } : { kind: 'cont', of: hi });
    else if (i < cont) cells.push({ kind: 'cont', of: i - 1 });
    else if (g) { const span = Math.min(g.slots, hi - i); cells.push({ kind: 'glass', key: g.key, label: g.label, span }); cont = i + span; }
    else cells.push({ kind: 'empty', label: '—', span: 1 });
  }
  return cells;
}
// Gli stadi in cui si può scegliere un vetro: non quelli di ND e diottria, né il
// secondo stadio di un vetro da due.
function editableStages(stages, ndIdx, dioIdx) {
  return stageCells(stages, ndIdx, dioIdx).map((c, i) => (c.kind === 'glass' || c.kind === 'empty' ? i : -1)).filter(i => i >= 0);
}
// Scelte per uno stadio: vuoto, poi i vetri del kit non usati altrove; uno da due
// stadi solo se anche lo stadio dopo è libero (hi = primo stadio non disponibile).
function stageOptions(i, stages = state.filters.stages, hi = stageRange(stages.length).hi) {
  const used = new Set(stages.filter((k, j) => k && j !== i));
  return [null, ...kitGlasses().filter(g => !used.has(g.key) && (g.slots < 2 || (i + 1 < hi && !stages[i + 1]))).map(g => g.key)];
}

function load() { try { return JSON.parse(localStorage.getItem(STORE_KEY)); } catch { return null; } }
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch {} }

let state = migrate(load()) || freshState();
fitStart();
let sel = { kind: 'lenschart' };
let view = 'land';
let page = 0;
let lensDb = null, lensDbError = '';
let dbSearch = { q: '', brand: '', type: '' };
const dbOpen = new Set();  // serie aperte nel database lenti ("Marca Serie"); le altre mostrano solo l'intestazione
let filterDb = [];
const imgCache = new Map();

// ============================================================================
// Formattazione
// ============================================================================
function fmt(n, max = 2) {
  if (n === null || n === undefined || n === '') return '—';
  const r = Math.round(Number(n) * 10 ** max) / 10 ** max;
  return String(r);
}
function focalText(l) { return l.focal != null ? fmt(l.focal, 1) : `${fmt(l.focalMin, 1)}-${fmt(l.focalMax, 1)}`; }
function focalSort(l) { return l.focal != null ? l.focal : (l.focalMin ?? 0); }
// Apertura: T, oppure f per le lenti di cui il costruttore pubblica solo l'f (stopType 'f').
function tText(l) { return l.tstop == null ? '—' : (l.stopType === 'f' ? 'f' : '') + (l.tstopLong ? `${fmt(l.tstop)}-${fmt(l.tstopLong)}` : fmt(l.tstop)); }

function ndLabel(d) {
  if (!d) return '—';
  const stops = Math.round(d / 0.3 * 10) / 10;
  if (state.filters.ndFormat === 'stops') return `${fmt(stops, 1)} stop`;
  if (state.filters.ndFormat === 'factor') return `${state.filters.ndType}${Math.round(2 ** stops)}`;
  return Number.isInteger(d) ? `${d}.0` : fmt(d, 2);  // 3.0 e non "3"
}
function dioLabel(d) { return d ? `${DIO_LABEL[d.v] || '+' + fmt(d.v)}${d.split ? ' SPLIT' : ''}` : '—'; }
// Totali che si ottengono con due ND del kit e che il kit non ha già come vetro
// singolo. Se un totale si fa in più modi vale la coppia con il vetro più denso.
// parts = [più denso, meno denso]: il più denso sta nello stadio 1.
function ndComboList(f = state.filters) {
  const nd = [...f.nd].sort((a, b) => a - b), best = new Map();
  for (let i = 0; i < nd.length; i++) for (let j = i + 1; j < nd.length; j++) {
    const t = Math.round((nd[i] + nd[j]) * 100) / 100;
    if (nd.includes(t)) continue;
    if (!best.has(t) || nd[j] > best.get(t)[0]) best.set(t, [nd[j], nd[i]]);
  }
  return [...best].sort((a, b) => a[0] - b[0]).map(([total, parts]) => ({ total, parts }));
}
// Scala dell'ND: nessuno, poi i vetri del kit e le coppie scelte, per densità.
function ndSteps() {
  const f = state.filters, ok = new Set(ndComboList().map(c => c.total));
  return [0, ...[...f.nd, ...(f.ndCombos || []).filter(t => ok.has(t))].sort((a, b) => a - b)];
}
// I vetri che fanno quel valore: uno, o i due di una coppia.
function ndParts(v) {
  if (!v) return [];
  return state.filters.nd.includes(v) ? [v] : ndComboList().find(c => c.total === v)?.parts || [v];
}
function dioSteps() { return [null, ...[...state.filters.dio].sort((a, b) => a.v - b.v || a.split - b.split)]; }

function slug(s) {
  return (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-|-$/g, '').toLowerCase().slice(0, 24) || 'card';
}

// ============================================================================
// Lens chart: ordinamento, paginazione, lente "fuori dal coro"
// ============================================================================
// ---------- Modifiche locali alle lenti del database (contratto in data/README.md) ----------
// lenses.json resta com'è (scheda del costruttore); le differenze dell'esemplare
// vivono qui, per id, e valgono per tutte le produzioni.
const OVR_KEY = 'camtag.lensOverrides.v1';
const OVR_FIELDS = [['tstop', 'T', 'number'], ['tstopLong', 'T tele', 'number'], ['mod_m', 'MOD m', 'number'],
                    ['front_mm', 'Ø mm', 'number'], ['filterThread', 'Filetto', 'text'], ['squeeze', 'Squeeze', 'number']];
let lensOverrides = (() => { try { return JSON.parse(localStorage.getItem(OVR_KEY))?.overrides || {}; } catch { return {}; } })();
function saveOverrides() { try { localStorage.setItem(OVR_KEY, JSON.stringify({ version: 1, overrides: lensOverrides })); } catch {} }
let lensById = new Map();
let editingUid = null;

// Valori della scheda + modifiche locali, mantenendo le scelte della produzione (sigla, negativo).
function dbWithOverrides(dbLens) { const o = lensOverrides[dbLens.id]; return o ? { ...dbLens, ...o } : dbLens; }
function effective(l) {
  const base = l.dbId && lensById.get(l.dbId);
  if (!base) return l;
  const tech = {};
  for (const [k] of OVR_FIELDS) tech[k] = base[k];
  tech.stopType = base.stopType;
  const o = lensOverrides[l.dbId] || {};
  // _mod: campi diversi dalla scheda, segnati con * sulla lens chart.
  return { ...l, ...tech, ...o, _mod: new Set(Object.keys(o).filter(k => k !== 'note')) };
}
// "*" accanto a un valore modificato rispetto alla scheda del costruttore.
function star(l, ...keys) { return l._mod && keys.some(k => l._mod.has(k)) ? '*' : ''; }
function isModified(l) { const o = l.dbId && lensOverrides[l.dbId]; return !!o && OVR_FIELDS.some(([k]) => k in o); }

function setOverride(dbId, key, raw, type) {
  const base = lensById.get(dbId); if (!base) return;
  const v = raw === '' ? null : type === 'number' ? Number(raw) : raw;
  const o = { ...(lensOverrides[dbId] || {}) };
  if (v === base[key] || (v === null && base[key] == null)) delete o[key]; else o[key] = v;
  if (Object.keys(o).filter(k => k !== 'note').length || o.note) lensOverrides[dbId] = o; else delete lensOverrides[dbId];
  saveOverrides();
}

function sortedLenses(list = state.lenses) { return list.map(effective).sort((a, b) => focalSort(a) - focalSort(b) || (a.seriesCode || '').localeCompare(b.seriesCode || '')); }
// Uno zoom è una lente con un'escursione al posto della focale.
const isZoom = l => l.focal == null;
// Gruppi della lens chart: tutte le lenti insieme, oppure prime e zoom separati
// (`state.lensSplit`). Ogni gruppo ha le sue pagine, le sue misure, la sua
// legenda e le sue lenti in negativo, come fosse una lens chart a sé.
function lensGroups() {
  const zooms = state.lenses.filter(isZoom), primes = state.lenses.filter(l => !isZoom(l));
  return state.lensSplit && zooms.length && primes.length ? [primes, zooms] : [state.lenses];
}
// Pagine: `rows` le lenti della pagina, `group` tutte quelle del suo gruppo, in ordine.
function lensPages() {
  const pages = [];
  for (const g of lensGroups()) {
    const group = sortedLenses(g);
    for (let i = 0; i < group.length; i += LENS_ROWS_PER_PAGE) pages.push({ rows: group.slice(i, i + LENS_ROWS_PER_PAGE), group });
  }
  return pages;
}
function plurality(items) {
  const m = new Map(); for (const k of items) m.set(k, (m.get(k) || 0) + 1);
  const sorted = [...m.entries()].sort((a, b) => b[1] - a[1]);
  if (!sorted.length || (sorted[1] && sorted[1][1] === sorted[0][1])) return null;  // pareggio: nessun principale
  return sorted[0][0];
}
// Evidenziata se di serie diversa dal set principale o di tipo diverso dal resto.
function outliers(L) {
  if (!L) return new Set(lensGroups().flatMap(g => [...outliers(g)]));  // tutte, gruppo per gruppo
  const out = new Set();
  const key = l => `${l.brand}|${l.series}`;
  const mainSeries = L.length > 1 ? plurality(L.map(key)) : null;
  const mainType = L.length > 1 ? plurality(L.map(l => l.type || 'prime')) : null;
  for (const l of L) {
    if (l.highlight === 'on') out.add(l.uid);
    else if (l.highlight !== 'off' &&
             ((mainSeries && key(l) !== mainSeries) || (mainType && (l.type || 'prime') !== mainType))) out.add(l.uid);
  }
  return out;
}

// ============================================================================
// Disegno: utilità
// ============================================================================
function fitFont(ctx, text, weight, maxW, maxSize, minSize = 10) {
  let s = Math.round(maxSize);
  for (; s > minSize; s -= 2) { ctx.font = `${weight} ${s}px ${FONT}`; if (ctx.measureText(text).width <= maxW) break; }
  ctx.font = `${weight} ${s}px ${FONT}`;
  return s;
}
function wrap(ctx, text, maxW) {
  const out = [];
  for (const para of String(text).split('\n')) {
    if (!para.trim()) { out.push(''); continue; }
    let line = '';
    for (const word of para.split(/\s+/)) {
      const test = line ? line + ' ' + word : word;
      if (ctx.measureText(test).width > maxW && line) { out.push(line); line = word; } else line = test;
    }
    out.push(line);
  }
  return out;
}
function newCanvas(W, H) {
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  return [cv, ctx];
}
function dims(layout) { const { w, h } = DEVICES[state.device]; return layout === 'port' ? [h, w] : [w, h]; }

// ============================================================================
// Schermata: lens chart
// ============================================================================
function drawLensChart(ctx, W, H, { rows, group }, pageIdx, pageCount) {
  const out = outliers(group);
  const pad = Math.round(W * 0.035);
  const barH = Math.round(H > W ? 64 : 56);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, barH);
  ctx.fillStyle = '#fff'; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  const title = (state.production || 'LENS CHART').toUpperCase();
  fitFont(ctx, title, 800, W * 0.7, barH * 0.5); ctx.fillText(title, pad, barH / 2);
  if (pageCount > 1) { ctx.textAlign = 'right'; ctx.font = `700 ${Math.round(barH * 0.4)}px ${FONT}`; ctx.fillText(`${pageIdx + 1}/${pageCount}`, W - pad, barH / 2); }

  // Righe alte quanto lo spazio permette: poche lenti = testo grande. Tutte le
  // pagine usano la misura della pagina più piena, così la scala non cambia.
  const n = Math.max(1, Math.min(group.length, LENS_ROWS_PER_PAGE));
  const footH = H > W ? 44 : 36;
  const avail = H - barH - footH - pad * 0.5;
  const tall = (avail / n) >= 120;  // abbastanza spazio: ogni lente su due righe
  const headH = tall ? 0 : Math.round(Math.min(46, Math.max(H > W ? 34 : 28, avail / n * 0.32)));
  const rowH = Math.min((avail - headH - (tall ? pad * 0.4 : 0)) / n, H * 0.45);
  const top = barH + headH + (tall ? pad * 0.4 : 0);
  ctx.fillStyle = '#000'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';

  if (!rows.length) {
    ctx.textAlign = 'center'; ctx.font = `600 ${Math.round(H * 0.045)}px ${FONT}`;
    ctx.fillText('Nessuna lente selezionata', W / 2, top + (H - top) / 2);
    return;
  }
  // Sigla piccola solo sulle lenti fuori dal set principale (o su tutte se non c'è).
  const leg = seriesLegend(group);
  const tag = l => leg.main && seriesKey(l) === leg.main ? '' : (l.seriesCode || '');
  // Dati accanto alla focale: T, MOD e, se l'utente lo vuole, il Ø frontale (sempre ultimo, indice 2).
  const specs = l => [['T', tText(l) + star(l, 'tstop', 'tstopLong')], ['MOD m', fmt(l.mod_m) + star(l, 'mod_m')],
                      ...(state.lensFront ? [['Ø mm', (l.front_mm != null ? fmt(l.front_mm, 1) : '—') + star(l, 'front_mm')]] : [])];
  const NS = state.lensFront ? 3 : 2;
  // Una sola misura per tipo di testo su tutta la pagina: la più grande che entra ovunque.
  const sizeFor = (texts, weight, maxW, maxSize) => Math.min(...texts.map(t => fitFont(ctx, t, weight, maxW, maxSize)));
  // Righe sottili allineate ai pixel e spesse 2: a mezzo pixel diventerebbero
  // grigie e la conversione in bianco e nero le cancellerebbe.
  const rule = y => { ctx.fillStyle = '#000'; ctx.fillRect(Math.round(pad), Math.round(y), Math.round(W - pad * 2), 2); };
  const inner = W - pad * 2;
  const SMALL = 0.72;  // Ø frontale: dato secondario, più piccolo (ma leggibile)
  const VAL = 0.8;     // T e MOD rispetto alla focale, che è sempre il testo più grande
  const ZOOM = 0.6;    // eccezione: l'escursione di uno zoom può scendere fin qui rispetto alla focale
  const TWO_COLS_GAIN = 1.2;  // due tabelle affiancate solo se la focale cresce almeno di tanto
  const smallSize = v => Math.min(v, Math.max(18, Math.round(v * SMALL)));

  // Riquadro in basso con il nome della serie per esteso (e la legenda delle sigle).
  ctx.fillStyle = '#000'; ctx.fillRect(pad, H - footH, inner, 2);
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  fitFont(ctx, leg.text, 700, inner, footH * 0.46, 11); ctx.fillText(leg.text, pad, H - footH / 2 + 1);

  if (tall) {
    // Sopra: focale grande (e sigla piccola). Sotto: T, MOD, Ø con l'etichetta sopra.
    // Gli zoom non rimpiccioliscono le focali dei prime: hanno la loro misura, mai più grande.
    const focalSize = set => set.length ? sizeFor(set.map(focalText), 900, inner * 0.7 - 20, rowH * 0.42) : null;
    const zsFit = focalSize(rows.filter(isZoom)), fs = focalSize(rows.filter(l => !isZoom(l))) ?? zsFit;
    const zs = Math.min(fs, zsFit ?? fs);
    const ls = Math.max(14, Math.round(rowH * 0.075));
    const groupW = inner / NS;
    const vs = Math.min(sizeFor(rows.flatMap(l => specs(l).map(s => s[1])), 800, groupW - 34, rowH * 0.26), Math.round(fs * VAL));
    rows.forEach((l, i) => {
      const y = top + i * rowH, line1 = y + rowH * 0.27;
      const labelY = y + rowH * 0.55, valueY = labelY + ls * 0.6 + vs * 0.62;
      if (i > 0) rule(y);
      const s = isZoom(l) ? zs : fs;
      ctx.font = `900 ${s}px ${FONT}`;
      const fw = ctx.measureText(focalText(l)).width;
      if (out.has(l.uid)) { ctx.fillStyle = '#000'; ctx.fillRect(pad, line1 - s * 0.62, fw + 20, s * 1.18); ctx.fillStyle = '#fff'; }
      ctx.textAlign = 'left'; ctx.fillText(focalText(l), pad + 10, line1);
      ctx.fillStyle = '#000';
      if (tag(l)) { ctx.font = `800 ${Math.round(s * 0.36)}px ${FONT}`; ctx.fillText(tag(l), pad + fw + 32, line1 + s * 0.12); }
      specs(l).forEach(([k, v], j) => {
        const x = pad + 10 + j * groupW;
        ctx.font = `600 ${ls}px ${FONT}`; ctx.fillText(k, x, labelY); // unità minuscole: "MOD m", "Ø mm"
        ctx.font = `800 ${j === 2 ? smallSize(vs) : vs}px ${FONT}`; ctx.fillText(v, x, valueY);
      });
    });
    return;
  }

  // Tabella: una riga per lente. Le colonne prendono la larghezza del loro
  // contenuto e una sola scala regola tutto: la focale più grande che entra,
  // con i dati a VAL della sua misura. L'escursione di uno zoom è lunga e
  // stringerebbe tutta la tabella: può scendere fino a ZOOM della focale, e
  // risale se avanza spazio. Si misura su tutte le lenti, non solo su quelle
  // della pagina, così ogni pagina ha le stesse misure.
  const heads = ['FOC', 'T', 'MOD m', 'Ø mm'].slice(0, NS + 1);
  const gap = 20, box = 8;  // box: margine dentro il riquadro della focale
  const GUTTER = 32;        // tra due tabelle affiancate, con la riga verticale in mezzo
  const all = group;
  const width = (t, weight, size) => { ctx.font = `${weight} ${size}px ${FONT}`; return ctx.measureText(t).width; };
  const valSize = (fs, j) => { const v = Math.round(fs * VAL); return j === 2 ? smallSize(v) : v; };
  // Misure con `count` tabelle affiancate, ognuna con la sua parte di righe.
  const fit = count => {
    const per = Math.ceil(n / count);
    const headH = Math.round(Math.min(46, Math.max(H > W ? 34 : 28, avail / per * 0.32)));
    const rowH = Math.min((avail - headH) / per, H * 0.45);
    const tableW = Math.floor((inner - GUTTER * (count - 1)) / count);
    const hs = Math.round(headH * 0.5);
    const tagSize = s => Math.max(15, Math.round(Math.min(s * 0.45, rowH * 0.36)));
    const focW = (l, s) => box + width(focalText(l), 900, s) + (tag(l) ? box + width(tag(l), 800, tagSize(s)) : 0) + box;
    const colWidths = (fs, zs) => [
      Math.max(box + width(heads[0], 700, hs), ...all.map(l => focW(l, isZoom(l) ? zs : fs))),
      ...heads.slice(1).map((_, j) => Math.max(width(heads[j + 1], 700, hs), ...all.map(l => width(specs(l)[j][1], 800, valSize(fs, j))))),
    ];
    const total = w => w.reduce((a, b) => a + b, 0) + gap * NS;
    const zoomMin = fs => Math.round(fs * ZOOM);
    let fs = Math.round(rowH * 0.62), w = colWidths(fs, zoomMin(fs));
    while (total(w) > tableW && fs > 16) { fs--; w = colWidths(fs, zoomMin(fs)); }
    let zs = zoomMin(fs);
    if (all.some(isZoom)) for (let z = fs; z > zs; z--) { const t = colWidths(fs, z); if (total(t) <= tableW) { zs = z; w = t; break; } }
    // Lo spazio che avanza va tra le colonne: l'ultima finisce sul margine destro.
    return { count, per, headH, rowH, tableW, hs, tagSize, fs, zs, w, extra: Math.max(0, (tableW - total(w)) / NS) };
  };
  // In orizzontale le lenti si dividono su due tabelle affiancate (prima metà a
  // sinistra) quando il testo ci guadagna davvero: righe alte il doppio in metà larghezza.
  const one = fit(1), two = W > H && n > 1 ? fit(2) : null;
  const L = two && two.fs >= one.fs * TWO_COLS_GAIN ? two : one;
  const { fs, zs, w } = L, tTop = barH + L.headH;
  for (let c = 0; c < L.count; c++) {
    const part = rows.slice(c * L.per, (c + 1) * L.per);
    if (!part.length) break;
    const x0 = pad + c * (L.tableW + GUTTER);
    const x = [x0]; for (let j = 1; j <= NS; j++) x.push(Math.round(x[j - 1] + w[j - 1] + gap + L.extra));
    ctx.fillStyle = '#000';
    if (c > 0) ctx.fillRect(x0 - GUTTER / 2 - 1, barH + 8, 2, H - footH - barH - 16);
    ctx.font = `700 ${L.hs}px ${FONT}`;
    heads.forEach((t, j) => ctx.fillText(t, x[j] + (j === 0 ? box : 0), barH + L.headH / 2 + 2));
    ctx.fillRect(x0, tTop - 2, L.tableW, 3);
    part.forEach((l, i) => {
      const y = tTop + i * L.rowH, mid = y + L.rowH / 2 + 1;
      if (i > 0) ctx.fillRect(x0, Math.round(y), L.tableW, 2);
      if (out.has(l.uid)) { ctx.fillStyle = '#000'; ctx.fillRect(x0, y + 3, Math.round(w[0]), L.rowH - 6); ctx.fillStyle = '#fff'; }
      const s = isZoom(l) ? zs : fs;
      ctx.font = `900 ${s}px ${FONT}`; ctx.fillText(focalText(l), x0 + box, mid);
      if (tag(l)) { const fw = ctx.measureText(focalText(l)).width; ctx.font = `800 ${L.tagSize(s)}px ${FONT}`; ctx.fillText(tag(l), x0 + box + fw + box, mid + s * 0.1); }
      ctx.fillStyle = '#000';
      specs(l).forEach(([, v], j) => { ctx.font = `800 ${valSize(fs, j)}px ${FONT}`; ctx.fillText(v, x[j + 1], mid); });
    });
  }
}

// Serie della produzione: quella principale per esteso, le altre come "SIGLA = nome".
function seriesKey(l) { return `${l.brand}|${l.series}`; }
function seriesName(l) {
  const s = l.series || '', b = l.brand || '';
  const name = s.toLowerCase().startsWith(b.toLowerCase()) ? s : `${b} ${s}`.trim();
  return name + (l.squeeze ? ` ×${fmt(l.squeeze)}` : '');
}
function seriesLegend(L = state.lenses.map(effective)) {
  const keys = [...new Set(L.map(seriesKey))];
  const main = keys.length === 1 ? keys[0] : plurality(L.map(seriesKey));
  const first = k => L.find(l => seriesKey(l) === k);
  const parts = [];
  if (main) parts.push(seriesName(first(main)));
  for (const k of keys) if (k !== main) parts.push(`${seriesName(first(k))} (${first(k).seriesCode})`);
  return { main, text: parts.join('  ·  ') };
}

// ============================================================================
// Schermata: filtri (sfondo + riquadri dei valori)
// ============================================================================
function filtersLayout(W, H) {
  const port = H > W, s = port ? STRIP.port : STRIP.land;
  // Area utile: tolte le fasce sui lati corti, dove il firmware disegna le indicazioni.
  const area = port ? { x: 0, y: s, w: W, h: H - 2 * s } : { x: s, y: 0, w: W - 2 * s, h: H };
  const pad = 22, barH = port ? 64 : 56;
  // La barra del titolo arriva ai bordi come nella lens chart; il titolo resta fuori
  // dalle fasce. Le indicazioni dei tasti vi si disegnano sopra in un riquadro bianco.
  const L = { port, area, pad, barH, bar: { x: 0, y: 0, w: W, h: port ? s + barH : barH } };
  const hasDio = state.filters.dio.length > 0;
  if (port) {
    let y = area.y + barH + 14;
    const slotH = hasDio ? 130 : 170;
    L.ndLabel = { x: area.x + pad, y }; y += 28;
    L.nd = { x: area.x + pad, y, w: area.w - 2 * pad, h: slotH }; y += slotH + 10;
    if (hasDio) { L.dioLabel = { x: area.x + pad, y }; y += 28; L.dio = { x: area.x + pad, y, w: area.w - 2 * pad, h: slotH }; y += slotH + 10; }
    L.list = { x: area.x + pad, y: y + 8, w: area.w - 2 * pad, h: area.y + area.h - y - 16 };
  } else {
    const colW = Math.round(area.w * 0.5);
    let y = area.y + barH + 12;
    const slotH = hasDio ? 150 : 330;
    L.ndLabel = { x: area.x + pad, y }; y += 28;
    L.nd = { x: area.x + pad, y, w: colW - pad * 1.5, h: slotH }; y += slotH + 8;
    if (hasDio) { L.dioLabel = { x: area.x + pad, y }; y += 28; L.dio = { x: area.x + pad, y, w: colW - pad * 1.5, h: slotH }; }
    L.list = { x: area.x + colW + pad * 0.5, y: area.y + barH + 16, w: area.w - colW - pad * 1.5, h: area.h - barH - 32 };
    L.divider = { x: area.x + colW - 2, y: area.y + barH + 16, h: area.h - barH - 32 };
  }
  for (const k of ['nd', 'dio', 'list']) if (L[k]) for (const p of ['x', 'y', 'w', 'h']) L[k][p] = Math.round(L[k][p]);
  // Una riga per stadio, tutte alte uguali (80 px al massimo, meno se gli stadi
  // sono tanti): entrano sempre tutte. Il firmware
  // compone ogni riga con due pezzi: colonna del numero (listNum) + vetro.
  const n = stageCount();
  L.listRow = n ? Math.min(80, Math.floor(L.list.h / n)) : 0;
  L.listNum = Math.round(L.listRow * 0.8);
  return L;
}

// Colonna del numero dello stadio, con un filo che la separa dal vetro.
function drawStageNum(ctx, x, y, w, h, n, selected) {
  ctx.fillStyle = selected ? '#000' : '#fff'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = selected ? '#fff' : '#000'; ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
  ctx.font = `800 ${Math.round(h * 0.5)}px ${FONT}`; ctx.fillText(String(n), x + Math.round((w - 2) / 2), y + Math.round(h / 2) + 1);
  const m = Math.round(h * 0.22); ctx.fillRect(x + w - 2, y + m, 2, h - 2 * m);
}
// Il vetro di uno stadio ("—" = vuoto); selezionato = in negativo.
// Una sola misura del testo per tutti i vetri del kit (e per ND e diottrie nei
// loro stadi): la più grande che entra ovunque, in una riga da uno stadio.
function stageFontSize(w, h) {
  const [, c] = newCanvas(1, 1);
  const labels = [...kitGlasses().map(g => g.label), ...state.filters.nd.map(ndStageLabel), ...state.filters.dio.map(dioStageLabel)];
  return Math.min(...labels.map(t => fitFont(c, t, 800, w - 16, h * 0.55)));
}
function drawStageGlass(ctx, x, y, w, h, label, selected, size) {
  ctx.fillStyle = selected ? '#000' : '#fff'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = selected ? '#fff' : '#000'; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  ctx.font = `800 ${size}px ${FONT}`; ctx.fillText(label, x + 12, y + Math.round(h / 2) + 1);
}
// Gli stadi come li compone il firmware (cells = stageCells): in ogni riga la
// colonna del numero; accanto il pezzo del vetro, alto quanti stadi occupa (chi ne
// occupa due ha il nome al centro delle due righe, e nella seconda non c'è altro
// pezzo). Poi un separatore da 2 px in cima a ogni riga dopo la prima: nel secondo
// stadio di un vetro da due solo sotto la colonna del numero.
// sel = stadio selezionato in modifica (in negativo per tutti gli stadi che occupa).
function drawStages(ctx, L, cells, sel = -1) {
  const gw = L.list.w - L.listNum, fs = stageFontSize(gw, L.listRow), selEnd = sel >= 0 ? sel + (cells[sel]?.span || 1) : -1;
  cells.forEach((c, i) => {
    const y = L.list.y + i * L.listRow, on = i >= sel && i < selEnd;
    drawStageNum(ctx, L.list.x, y, L.listNum, L.listRow, i + 1, on);
    if (c.kind !== 'cont') drawStageGlass(ctx, L.list.x + L.listNum, y, gw, L.listRow * c.span, c.label, on, fs);
    if (i > 0) { ctx.fillStyle = '#000'; ctx.fillRect(L.list.x, y, c.kind === 'cont' ? L.listNum : L.list.w, 2); }
  });
}

function drawFiltersBackground(ctx, W, H) {
  const L = filtersLayout(W, H), f = state.filters;
  ctx.fillStyle = '#000'; ctx.fillRect(L.bar.x, L.bar.y, L.bar.w, L.bar.h);
  ctx.fillStyle = '#fff'; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  fitFont(ctx, 'FILTRI', 800, L.area.w - L.pad * 2, L.barH * 0.5); ctx.fillText('FILTRI', L.area.x + L.pad, L.bar.h - L.barH / 2);
  ctx.fillStyle = '#000'; ctx.textBaseline = 'alphabetic';
  ctx.font = `700 22px ${FONT}`;
  ctx.fillText(f.ndType, L.ndLabel.x, L.ndLabel.y + 20);
  if (L.dio) ctx.fillText('DIOTTRIA', L.dioLabel.x, L.dioLabel.y + 20);
  if (L.divider) ctx.fillRect(L.divider.x, L.divider.y, 3, L.divider.h);
  else ctx.fillRect(L.list.x, L.list.y - 10, L.list.w, 3);
  // Gli stadi non sono nello sfondo: cambiano sul dispositivo, li compone il
  // firmware con i pezzi esportati (drawStages).
  return L;
}

// Riquadro di un valore: testo grande centrato su bianco.
function drawTile(ctx, x, y, w, h, text) {
  ctx.fillStyle = '#fff'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#000'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  fitFont(ctx, text, 900, w - 10, text === '—' ? h * 0.35 : h * 0.82);  // "nessuno": un trattino, non una barra
  ctx.fillText(text, x + 4, y + h / 2 + h * 0.04);
}

// Indicazioni dei tasti come le disegnerà il firmware (solo anteprima verticale).
function hintLabels() {
  const h = {};
  for (const k of ['A', 'B', 'C', 'D']) { const t = rockerHint(k, 0); if (t) h[k] = t; }
  return h;
}
function drawHintsPreview(ctx, W, H) {
  if (H <= W) return;
  ctx.fillStyle = '#000'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `700 15px ui-monospace, Menlo, monospace`;
  for (const [k, t] of Object.entries(hintLabels())) ctx.fillText(t, KEY_POS[k] * W, H - STRIP.port / 2);
}

// ============================================================================
// Schede manuali (lente singola, crew, note, patch)
// ============================================================================
function drawFocal(ctx, big, x, maxW, maxSize, y, centredOnY) {
  let s = maxSize, bw, mw;
  for (; s > 20; s -= 2) {
    ctx.font = `900 ${s}px ${FONT}`; bw = ctx.measureText(big).width;
    ctx.font = `700 ${Math.round(s * 0.28)}px ${FONT}`; mw = ctx.measureText('mm').width;
    if (bw + 8 + mw <= maxW) break;
  }
  const baseY = centredOnY ? y + s * 0.36 : y + s * 0.78;
  ctx.font = `900 ${s}px ${FONT}`; ctx.fillText(big, x, baseY);
  ctx.font = `700 ${Math.round(s * 0.28)}px ${FONT}`; ctx.fillText('mm', x + bw + 8, baseY);
  return s;
}

function drawLens(ctx, W, H, c) {
  const pad = Math.round(W * 0.045);
  const barH = Math.round(H * 0.17);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, barH);
  ctx.fillStyle = '#fff'; ctx.textBaseline = 'middle';
  const head = `${c.brand}`.toUpperCase();
  fitFont(ctx, head, 800, W * 0.55, barH * 0.5);
  ctx.textAlign = 'left'; ctx.fillText(head, pad, barH / 2);
  ctx.textAlign = 'right'; fitFont(ctx, c.series, 500, W * 0.38, barH * 0.38);
  ctx.fillText(c.series, W - pad, barH / 2);

  ctx.fillStyle = '#000'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  const portrait = H > W;
  const specs = [['T', c.tstop], ['MOD', c.mod], ['Ø FRONTALE', c.front], ['FILETTO FILTRI', c.thread]].filter(s => s[1]);
  const notesH = c.notes ? Math.round(H * 0.11) : 0;

  if (!portrait) {
    const colW = W * 0.58;
    drawFocal(ctx, `${c.focal}`, pad, colW - pad * 1.5, H * 0.55, (barH + (H - barH - notesH) / 2), true);
    const x = colW + pad * 0.5, rowH = (H - barH - notesH - pad) / Math.max(specs.length, 1);
    ctx.fillRect(colW, barH + pad * 0.6, 4, H - barH - notesH - pad * 1.2);
    specs.forEach(([k, v], i) => {
      const y = barH + pad * 0.5 + rowH * i;
      ctx.font = `600 ${Math.round(rowH * 0.22)}px ${FONT}`; ctx.fillText(k, x, y + rowH * 0.32);
      fitFont(ctx, v, 800, W - x - pad, rowH * 0.48); ctx.fillText(v, x, y + rowH * 0.82);
    });
  } else {
    const s = drawFocal(ctx, `${c.focal}`, pad, W - pad * 2, H * 0.28, barH + pad, false);
    const top = barH + pad + s * 0.78 + pad, rowH = (H - top - notesH - pad) / Math.max(specs.length, 1);
    specs.forEach(([k, v], i) => {
      const y = top + rowH * i;
      ctx.fillRect(pad, y, W - pad * 2, 3);
      ctx.font = `600 ${Math.round(rowH * 0.24)}px ${FONT}`; ctx.fillText(k, pad, y + rowH * 0.62);
      ctx.textAlign = 'right'; fitFont(ctx, v, 800, W * 0.6, rowH * 0.5); ctx.fillText(v, W - pad, y + rowH * 0.68); ctx.textAlign = 'left';
    });
  }
  if (c.notes) {
    ctx.fillRect(0, H - notesH, W, 3);
    fitFont(ctx, c.notes, 600, W - pad * 2, notesH * 0.5);
    ctx.textBaseline = 'middle'; ctx.fillText(c.notes, pad, H - notesH / 2 + 2);
  }
}

function drawCrew(ctx, W, H, c) {
  const pad = Math.round(W * 0.045);
  const barH = Math.round(H * 0.15);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, barH);
  ctx.fillStyle = '#fff'; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  fitFont(ctx, (c.title || '').toUpperCase(), 800, W - pad * 2, barH * 0.5);
  ctx.fillText((c.title || '').toUpperCase(), pad, barH / 2);
  const rows = String(c.lines).split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    const i = l.indexOf(':'); return i < 0 ? ['', l] : [l.slice(0, i).trim(), l.slice(i + 1).trim()];
  });
  if (!rows.length) return;
  const cols = rows.length > 6 && W > H ? 2 : 1;
  const perCol = Math.ceil(rows.length / cols);
  const colW = (W - pad * (cols + 1)) / cols;
  const rowH = Math.min((H - barH - pad) / perCol, H * 0.2);
  ctx.fillStyle = '#000';
  rows.forEach(([role, name], i) => {
    const col = Math.floor(i / perCol), r = i % perCol;
    const x = pad + col * (colW + pad), y = barH + pad * 0.5 + r * rowH;
    if (r > 0) ctx.fillRect(x, y, colW, 2);
    ctx.textBaseline = 'alphabetic';
    ctx.font = `600 ${Math.round(rowH * 0.24)}px ${FONT}`;
    ctx.fillText(role.toUpperCase(), x, y + rowH * 0.36);
    fitFont(ctx, name, 800, colW, rowH * 0.42);
    ctx.fillText(name, x, y + rowH * 0.84);
  });
}

function drawNotes(ctx, W, H, c) {
  const pad = Math.round(W * 0.05);
  ctx.fillStyle = '#000'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  let top = pad;
  if (c.title) {
    const s = fitFont(ctx, c.title.toUpperCase(), 900, W - pad * 2, H * 0.12);
    ctx.fillText(c.title.toUpperCase(), pad, top + s * 0.8);
    top += s * 0.8 + pad * 0.5;
    ctx.fillRect(pad, top, W - pad * 2, 4);
    top += pad * 0.6;
  }
  let size = Math.round(H * 0.1), lines;
  for (; size > 14; size -= 2) {
    ctx.font = `600 ${size}px ${FONT}`;
    lines = wrap(ctx, c.body, W - pad * 2);
    if (lines.length * size * 1.25 <= H - top - pad) break;
  }
  ctx.font = `600 ${size}px ${FONT}`;
  lines.forEach((l, i) => ctx.fillText(l, pad, top + size * (i + 1) * 1.25 - size * 0.25));
}

function drawPatch(ctx, W, H, c) {
  const capH = c.caption ? Math.round(H * 0.14) : 0;
  const img = c.img && imgCache.get(c.img);
  if (img) {
    const areaH = H - capH;
    const s = c.fit === 'cover' ? Math.max(W / img.width, areaH / img.height) : Math.min(W / img.width, areaH / img.height);
    const w = img.width * s, h = img.height * s;
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, areaH); ctx.clip();
    ctx.drawImage(img, (W - w) / 2, (areaH - h) / 2, w, h);
    ctx.restore();
  } else {
    ctx.fillStyle = '#000'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `600 ${Math.round(H * 0.06)}px ${FONT}`;
    ctx.fillText('Carica un\'immagine', W / 2, (H - capH) / 2);
  }
  if (c.caption) {
    ctx.fillStyle = '#000'; ctx.fillRect(0, H - capH, W, capH);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    fitFont(ctx, c.caption.toUpperCase(), 800, W * 0.9, capH * 0.55);
    ctx.fillText(c.caption.toUpperCase(), W / 2, H - capH / 2);
  }
}

// ============================================================================
// Rasterizzazione 1 bit e BMP
// ============================================================================
function toBits(ctx, W, H, mode = 'threshold', t = 128) {
  const src = ctx.getImageData(0, 0, W, H).data;
  const g = new Float32Array(W * H);
  for (let i = 0; i < W * H; i++) g[i] = 0.299 * src[i * 4] + 0.587 * src[i * 4 + 1] + 0.114 * src[i * 4 + 2];
  if (mode === 'atkinson') return atkinson(g, W, H);
  if (mode === 'fs') return floyd(g, W, H);
  const b = new Uint8Array(W * H); for (let i = 0; i < g.length; i++) b[i] = g[i] >= t ? 1 : 0; return b;
}
function atkinson(g, W, H) {
  const b = new Uint8Array(W * H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x, old = g[i], nv = old < 128 ? 0 : 255; b[i] = nv ? 1 : 0;
    const e = (old - nv) / 8;
    for (const [dx, dy] of [[1,0],[2,0],[-1,1],[0,1],[1,1],[0,2]]) {
      const xx = x + dx, yy = y + dy; if (xx >= 0 && xx < W && yy < H) g[yy * W + xx] += e;
    }
  }
  return b;
}
function floyd(g, W, H) {
  const b = new Uint8Array(W * H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x, old = g[i], nv = old < 128 ? 0 : 255; b[i] = nv ? 1 : 0;
    const e = old - nv;
    if (x + 1 < W) g[i + 1] += e * 7 / 16;
    if (y + 1 < H) { if (x > 0) g[i + W - 1] += e * 3 / 16; g[i + W] += e * 5 / 16; if (x + 1 < W) g[i + W + 1] += e / 16; }
  }
  return b;
}
// 1-bit BMP: palette 0 = nero, 1 = bianco, righe dal basso, allineate a 4 byte.
function encodeBmp(bits, W, H) {
  const rowBytes = Math.ceil(W / 32) * 4, dataSize = rowBytes * H, off = 62;
  const buf = new ArrayBuffer(off + dataSize), dv = new DataView(buf), u8 = new Uint8Array(buf);
  u8[0] = 0x42; u8[1] = 0x4D; dv.setUint32(2, off + dataSize, true); dv.setUint32(10, off, true);
  dv.setUint32(14, 40, true); dv.setInt32(18, W, true); dv.setInt32(22, H, true);
  dv.setUint16(26, 1, true); dv.setUint16(28, 1, true); dv.setUint32(30, 0, true);
  dv.setUint32(34, dataSize, true); dv.setInt32(38, 2835, true); dv.setInt32(42, 2835, true);
  dv.setUint32(46, 2, true); dv.setUint32(50, 2, true);
  u8.set([0, 0, 0, 0, 255, 255, 255, 0], 54);
  for (let y = 0; y < H; y++) {
    const rowOff = off + (H - 1 - y) * rowBytes;
    for (let x = 0; x < W; x++) if (bits[y * W + x]) u8[rowOff + (x >> 3)] |= 0x80 >> (x & 7);
  }
  return new Blob([buf], { type: 'image/bmp' });
}

// ============================================================================
// Render delle schermate
// ============================================================================
// opts.preview: compone anche valori e indicazioni (per l'anteprima).
function renderScreen(s, layout, opts = {}) {
  const [W, H] = dims(layout);
  const [cv, ctx] = newCanvas(W, H);
  if (s.kind === 'lenschart') {
    const pages = lensPages();
    drawLensChart(ctx, W, H, pages[s.page] || { rows: [], group: [] }, s.page, pages.length);
  } else if (s.kind === 'filters') {
    const L = drawFiltersBackground(ctx, W, H);
    if (opts.preview) {
      const f = state.filters;
      drawTile(ctx, L.nd.x, L.nd.y, L.nd.w, L.nd.h, ndLabel(ndSteps()[opts.nd ?? f.previewNd] || 0));
      if (L.dio) drawTile(ctx, L.dio.x, L.dio.y, L.dio.w, L.dio.h, dioLabel(dioSteps()[opts.dio ?? f.previewDio] || null));
      if (stageCount()) drawStages(ctx, L, stageCells(opts.stages ?? f.stages, opts.ndStages ?? opts.nd ?? f.previewNd, opts.dioStages ?? opts.dio ?? f.previewDio), opts.sel ?? -1);
      if (!opts.noHints) drawHintsPreview(ctx, W, H);
    }
  } else {
    const c = s.card;
    ({ lens: drawLens, crew: drawCrew, notes: drawNotes, patch: drawPatch })[c.type](ctx, W, H, c);
    const photo = c.type === 'patch' && c.img && c.dither !== 'none';
    const bits = toBits(ctx, W, H, photo ? c.dither : 'threshold', c.type === 'patch' ? c.threshold : TEXT_T);
    if (c.type === 'patch' && c.invert) {
      const end = c.caption ? (H - Math.round(H * 0.14)) * W : W * H;
      for (let i = 0; i < end; i++) bits[i] ^= 1;
    }
    return { bits, w: W, h: H };
  }
  return { bits: toBits(ctx, W, H, 'threshold', TEXT_T), w: W, h: H };
}

function renderTileBits(text, w, h) {
  const [, ctx] = newCanvas(w, h);
  drawTile(ctx, 0, 0, w, h, text);
  return toBits(ctx, w, h, 'threshold', TEXT_T);
}

function layoutsOf(c) { return c.formats === 'land' ? ['land'] : c.formats === 'port' ? ['port'] : ['land', 'port']; }

// ============================================================================
// Esportazione
// ============================================================================
// Ordine sul dispositivo: lens chart (pagine), filtri, schede manuali.
function exportPlan() {
  const plan = [];
  if (state.auto.lenschart && state.lenses.length)
    lensPages().forEach((_, i) => plan.push({ kind: 'lenschart', page: i, base: i ? `lenschart-${i + 1}` : 'lenschart' }));
  if (state.auto.filters) plan.push({ kind: 'filters', base: 'filters' });
  state.cards.forEach(c => plan.push({ kind: 'card', card: c, base: `${c.type}_${slug(cardTitle(c))}` }));
  plan.forEach((p, i) => p.name = `${String(i + 1).padStart(2, '0')}_${p.base}`);
  return plan;
}

// Descrive al firmware dove comporre i valori e quali tasti li cambiano.
function filtersIni() {
  const out = ['# camtag screen v3', 'type=filters'];
  const nd = ndSteps(), dio = dioSteps();
  out.push(`nd.count=${nd.length}`, `nd.labels=${nd.map(ndLabel).join('|')}`);
  // Vetri ND del kit e, per ogni passo, quali vetri lo fanno (indici da 1, "+" per
  // una coppia, il primo nello stadio 1).
  const ndGlasses = [...state.filters.nd].sort((a, b) => a - b);
  out.push(`nd.glasses=${ndGlasses.map(ndStageLabel).join('|')}`, `nd.parts=${nd.map(v => ndParts(v).map(g => ndGlasses.indexOf(g) + 1).join('+') || '-').join('|')}`);
  out.push(`dio.count=${state.filters.dio.length ? dio.length : 0}`);
  // dio.slots: stadi occupati da ogni passo della diottria (0 = nessuna), gli ultimi.
  if (state.filters.dio.length) out.push(`dio.labels=${dio.map(dioLabel).join('|')}`, `dio.slots=${dio.map(dioSlots).join('|')}`);
  for (const layout of ['land', 'port']) {
    const [W, H] = dims(layout), L = filtersLayout(W, H);
    out.push(`${layout}.nd=${L.nd.x},${L.nd.y},${L.nd.w},${L.nd.h}`);
    if (L.dio) out.push(`${layout}.dio=${L.dio.x},${L.dio.y},${L.dio.w},${L.dio.h}`);
  }
  // Per ogni verso (gradi in senso orario): funzione dei tasti e testo dell'indicazione.
  for (const rot of [0, 90, 180, 270]) {
    const acts = ['A', 'B', 'C', 'D'].map(k => [k, rockerAction(k, true, rot)]).filter(([, a]) => a.role);
    out.push(`keys.${rot}=${acts.map(([k, a]) => `${k}:${a.role}${a.dir > 0 ? '+' : '-'}`).join('|')}`);
    out.push(`hints.${rot}=${['A', 'B', 'C', 'D'].map(k => [k, rockerHint(k, rot)]).filter(([, t]) => t).map(([k, t]) => `${k}:${t}`).join('|')}`);
  }
  out.push(`nd.start=${state.filters.previewNd}`, `dio.start=${state.filters.previewDio}`);

  // Stadi del mattebox: i vetri del kit nell'ordine in cui si scorrono, quanti
  // stadi occupa ognuno (kit.slots) e il vetro che comincia in ogni stadio alla
  // partenza (indice nel kit, "-" = nessuno: vuoto, di ND o diottria, o secondo
  // stadio di un vetro da due). L'ND occupa i primi stadi da stages.nd, la
  // diottria gli ultimi se ci sta tutta dopo l'ND; i vetri si rimettono a posto
  // quando ND e diottria restano fermi per stages.settle secondi.
  // Pezzi: stN / stsN = colonna del numero dello stadio N (normale / selezionata);
  // fxG / fxsG = vetro G (indice nel kit, n = vuoto), alto kit.slots righe;
  // fxdK = il vetro ND K (vedi nd.glasses, nd.parts); fxoI = la diottria al
  // passo I, alta dio.slots righe. Tutti con .p per il verticale.
  const kit = kitGlasses(), stages = stageCount() ? state.filters.stages : [];
  out.push(`kit.count=${kit.length}`, `kit.labels=${kit.map(g => g.label).join('|')}`, `kit.slots=${kit.map(g => g.slots).join('|')}`);
  out.push(`stages.count=${stages.length}`, `stages.nd=1`, `stages.settle=${SETTLE_S}`, `stages.start=${stages.map(k => (k ? kit.findIndex(g => g.key === k) : '-')).join('|')}`);
  for (const layout of ['land', 'port']) {
    const [W, H] = dims(layout), L = filtersLayout(W, H);
    out.push(`${layout}.list=${L.list.x},${L.list.y},${L.list.w},${L.list.h}`, `${layout}.listRow=${L.listRow}`, `${layout}.listNum=${L.listNum}`);
  }
  // Modifica degli stadi (tieni A o B per entrare; E, F o tieni A o B per uscire), per verso: passo delle
  // righe per A/B (+1 = stadio successivo), verso del vetro per C/D, indicazioni.
  for (const rot of [0, 90, 180, 270]) {
    out.push(`edit.keys.${rot}=A:row${editNavStep('A', rot) > 0 ? '+' : '-'}|B:row${editNavStep('B', rot) > 0 ? '+' : '-'}|C:val${keyDir('C', rot) > 0 ? '+' : '-'}|D:val${keyDir('D', rot) > 0 ? '+' : '-'}`);
    out.push(`edit.hints.${rot}=${['A', 'B', 'C', 'D'].map(k => `${k}:${editHint(k, rot)}`).join('|')}`);
  }
  out.push(`edit.timeout=${EDIT_TIMEOUT_S}`);
  return out.join('\n') + '\n';
}

async function buildZip() {
  const zip = new JSZip(), dir = zip.folder('camtag');
  for (const p of exportPlan()) {
    if (p.kind === 'card') {
      for (const l of layoutsOf(p.card)) { const r = renderScreen(p, l); dir.file(`${p.name}${l === 'port' ? '.p' : ''}.bmp`, encodeBmp(r.bits, r.w, r.h)); }
      continue;
    }
    for (const l of ['land', 'port']) { const r = renderScreen(p, l); dir.file(`${p.name}${l === 'port' ? '.p' : ''}.bmp`, encodeBmp(r.bits, r.w, r.h)); }
    if (p.kind === 'filters') {
      const sub = dir.folder(p.name);
      sub.file('screen.ini', filtersIni());
      for (const l of ['land', 'port']) {
        const [W, H] = dims(l), L = filtersLayout(W, H), ext = l === 'port' ? '.p.bmp' : '.bmp';
        ndSteps().forEach((v, i) => sub.file(`nd${i}${ext}`, encodeBmp(renderTileBits(ndLabel(v), L.nd.w, L.nd.h), L.nd.w, L.nd.h)));
        if (L.dio) dioSteps().forEach((v, i) => sub.file(`dio${i}${ext}`, encodeBmp(renderTileBits(dioLabel(v), L.dio.w, L.dio.h), L.dio.w, L.dio.h)));
        // Stadi: colonna del numero e vetri, normali e selezionati (vedi filtersIni).
        const bits = (w, h, draw) => { const [, c] = newCanvas(w, h); draw(c); return encodeBmp(toBits(c, w, h, 'threshold', TEXT_T), w, h); };
        const gw = L.list.w - L.listNum, fs = stageCount() ? stageFontSize(gw, L.listRow) : 0;
        for (const sel of [false, true]) {
          for (let n = 1; n <= stageCount(); n++)
            sub.file(`${sel ? 'sts' : 'st'}${n}${ext}`, bits(L.listNum, L.listRow, c => drawStageNum(c, 0, 0, L.listNum, L.listRow, n, sel)));
          // Un vetro da due stadi ha il pezzo alto due righe.
          if (stageCount()) [['n', '—', 1], ...kitGlasses().map((g, i) => [i, g.label, g.slots])].forEach(([i, label, n]) =>
            sub.file(`${sel ? 'fxs' : 'fx'}${i}${ext}`, bits(gw, L.listRow * n, c => drawStageGlass(c, 0, 0, gw, L.listRow * n, label, sel, fs))));
        }
        // I vetri ND negli stadi: mai selezionati, quindi solo la versione normale.
        if (stageCount()) [...state.filters.nd].sort((a, b) => a - b).forEach((v, i) =>
          sub.file(`fxd${i + 1}${ext}`, bits(gw, L.listRow, c => drawStageGlass(c, 0, 0, gw, L.listRow, ndStageLabel(v), false, fs))));
        // La diottria negli ultimi stadi: come l'ND non si seleziona.
        if (stageCount()) dioSteps().forEach((d, i) => { if (d) { const hh = L.listRow * dioSlots(d);
          sub.file(`fxo${i}${ext}`, bits(gw, hh, c => drawStageGlass(c, 0, 0, gw, hh, dioStageLabel(d), false, fs))); } });
      }
    }
  }
  // Il progetto viaggia con le card: il firmware lo ignora, lo strumento lo riprende (Importa dall'X3).
  dir.file(PROJECT_FILE, JSON.stringify(projectData()));
  return zip;
}

// ============================================================================
// Interfaccia
// ============================================================================
const $ = s => document.querySelector(s);
const preview = $('#preview');
function h(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'class') e.className = v;
    else if (v === true) e.setAttribute(k, '');
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null) e.append(k instanceof Node ? k : document.createTextNode(k));
  return e;
}
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

// Preferenze dell'interfaccia (sezioni aperte, orientamento, anteprima o simulatore):
// sono del browser, non del progetto, quindi non entrano in project.json.
const UI_KEY = 'camtag.ui.v1';
const ui = { sec: {}, view: 'land', mode: 'preview', ...(() => { try { return JSON.parse(localStorage.getItem(UI_KEY)) || {}; } catch { return {}; } })() };
if (!ui.sec || typeof ui.sec !== 'object') ui.sec = {};
function saveUi() { try { localStorage.setItem(UI_KEY, JSON.stringify(ui)); } catch {} }
view = ui.view === 'port' ? 'port' : 'land';

// ---------- Riquadri a comparsa: menu e spiegazioni ----------
// Uno alla volta, accanto a chi lo apre e sempre dentro lo schermo. Si chiude
// toccando fuori, con Esc, scorrendo o ridimensionando.
const HAS_POPOVER = 'showPopover' in HTMLElement.prototype;
let pop = null;  // { el, anchor, pinned }: pinned = aperto con un clic, non solo passandoci sopra
function showPop(el, anchor, pinned = true) {
  hidePop();
  if (HAS_POPOVER) { el.popover = 'manual'; el.showPopover(); }  // sopra a tutto, anche ai blocchi fissi
  el.classList.add('open');
  el.style.left = el.style.top = '0px';
  const a = anchor.getBoundingClientRect(), vw = document.documentElement.clientWidth, m = 8;
  const w = el.offsetWidth, eh = el.offsetHeight, below = a.bottom + 6;
  el.style.left = `${Math.max(m, Math.min(a.left, vw - w - m))}px`;
  el.style.top = `${below + eh > innerHeight - m && a.top - 6 - eh >= m ? a.top - 6 - eh : below}px`;
  anchor.setAttribute('aria-expanded', 'true');
  pop = { el, anchor, pinned };
}
function hidePop() {
  if (!pop) return;
  if (HAS_POPOVER) pop.el.hidePopover();
  pop.el.classList.remove('open');
  pop.anchor.setAttribute('aria-expanded', 'false');
  pop = null;
}
document.addEventListener('pointerdown', e => { if (pop && !pop.el.contains(e.target) && !pop.anchor.contains(e.target)) hidePop(); }, true);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && pop) { const a = pop.anchor; hidePop(); a.focus(); } });
addEventListener('scroll', hidePop, { capture: true, passive: true });
addEventListener('resize', hidePop);
function menuButton(btn, menu) {
  btn.setAttribute('aria-haspopup', 'menu'); btn.setAttribute('aria-expanded', 'false');
  btn.addEventListener('click', () => { if (pop && pop.anchor === btn) hidePop(); else showPop(menu, btn); });
  menu.addEventListener('click', e => { if (e.target.closest('button')) hidePop(); });
}
// Spiegazione dietro una ⓘ: da computer compare passando col mouse o col fuoco da
// tastiera; al tocco (dove l'hover non esiste) si apre e si chiude con un tocco.
function info(text) {
  const b = h('button', { type: 'button', class: 'info', 'aria-label': 'Spiegazione', 'aria-expanded': 'false' });
  const isOpen = () => !!pop && pop.anchor === b;
  const open = pinned => { const t = $('#tip'); t.textContent = text; showPop(t, b, pinned); };
  b.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse' && !isOpen()) open(false); });
  b.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse' && isOpen() && !pop.pinned) hidePop(); });
  b.addEventListener('focus', () => { if (!isOpen() && b.matches(':focus-visible')) open(false); });
  b.addEventListener('blur', () => { if (isOpen()) hidePop(); });
  b.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); if (isOpen() && pop.pinned) hidePop(); else open(true); });
  return b;
}

// ---------- Componenti dell'editor ----------
// Sezione richiudibile con il riepilogo nella riga del titolo. Aperta o chiusa si
// ricorda in camtag.ui.v1, così sopravvive ai renderEditor() completi; finché non
// la tocchi vale `openByDefault`.
function section(id, title, summary, content, openByDefault = true, { tip, sub = false } = {}) {
  const want = () => ui.sec[id] ?? openByDefault;
  const d = h('details', { class: 'sec' + (sub ? ' sub' : ''), open: want() },
    h('summary', {}, h('span', { class: 'sec-t' }, title), tip ? info(tip) : null, h('span', { class: 'sec-s' }, summary)),
    h('div', { class: 'sec-b' }, content));
  d.addEventListener('toggle', () => { if (d.open !== want()) { ui.sec[id] = d.open; saveUi(); } });
  return d;
}
// Etichetta di un controllo, con la sua spiegazione se serve.
function lab(text, tip) { return h('div', { class: 'lab' }, h('span', {}, text), tip ? info(tip) : null); }
// Scelta fra poche alternative: options = [[valore, testo, title?], …].
function seg(options, value, onchange, label) {
  return h('div', { class: 'seg', role: 'group', 'aria-label': label },
    ...options.map(([v, t, title]) => h('button', { type: 'button', class: v === value ? 'on' : '', 'aria-pressed': String(v === value), title, onclick: () => { if (v !== value) onchange(v); } }, t)));
}
// Casella a pillola: la casella vera è dentro l'etichetta, nascosta.
function pill(text, checked, onchange, value) {
  return h('label', { class: 'pill' }, h('input', { type: 'checkbox', checked, value, onchange: e => onchange(e.target.checked) }), text);
}
function toggle(text, checked, onchange, { tip, title } = {}) {
  const sw = h('label', { class: 'switch', title },
    h('input', { type: 'checkbox', role: 'switch', checked, onchange: e => onchange(e.target.checked) }), h('span', { class: 'track' }), h('span', {}, text));
  return tip ? h('div', { class: 'sw-row' }, sw, info(tip)) : sw;
}
// Testata dell'editor: titolo e, a destra, tutto ciò che riguarda la schermata scelta.
function editorHead(title, ...acts) { return h('div', { class: 'ed-head' }, h('h2', {}, title), h('div', { class: 'ed-acts' }, ...acts)); }
const includeSwitch = key => toggle('Includi', state.auto[key], v => { state.auto[key] = v; changed(); }, { title: 'Includi nell\'esportazione' });
function cardTitle(c) {
  if (c.type === 'lens') return `${c.focal}mm ${c.brand}`;
  if (c.type === 'crew') return c.title || 'Crew';
  if (c.type === 'notes') return c.title || 'Note';
  return c.caption || 'Immagine';
}
function selectedScreen() {
  if (sel.kind === 'lenschart') return { kind: 'lenschart', page: Math.min(page, Math.max(lensPages().length - 1, 0)) };
  if (sel.kind === 'filters') return { kind: 'filters' };
  const c = state.cards[sel.i]; return c ? { kind: 'card', card: c } : null;
}
function availableLayouts() { const s = selectedScreen(); return s && s.kind === 'card' ? layoutsOf(s.card) : ['land', 'port']; }
function currentLayout() { const l = availableLayouts(); return l.includes(view) ? view : l[0]; }

function drawPreview() {
  const s = selectedScreen(), ctx = preview.getContext('2d');
  if (!s) { preview.width = 792; preview.height = 528; ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, 792, 528); return; }
  const layout = currentLayout(), r = renderScreen(s, layout, { preview: true });
  preview.width = r.w; preview.height = r.h;
  const img = ctx.createImageData(r.w, r.h);
  for (let i = 0; i < r.w * r.h; i++) { const c = r.bits[i] ? 255 : 0; img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = c; img.data[i * 4 + 3] = 255; }
  ctx.putImageData(img, 0, 0);
  const layouts = availableLayouts();
  document.querySelectorAll('[data-view]').forEach(b => {
    b.classList.toggle('on', b.dataset.view === layout); b.setAttribute('aria-pressed', String(b.dataset.view === layout)); b.disabled = !layouts.includes(b.dataset.view);
  });
  $('#fView').disabled = layouts.length < 2;  // sul telefono l'orientamento è un solo pulsante sulla cornice

  const pc = $('#pageCtl'), n = s.kind === 'lenschart' ? lensPages().length : 1; pc.innerHTML = '';
  if (n > 1) pc.append(h('button', { class: 'small', 'aria-label': 'Pagina precedente', disabled: s.page === 0, onclick: () => turnPage(-1) }, '‹'),
                       h('span', { title: 'Pagina' }, `${s.page + 1}/${n}`),
                       h('button', { class: 'small', 'aria-label': 'Pagina successiva', disabled: s.page >= n - 1, onclick: () => turnPage(1) }, '›'));
  $('#fPrev').hidden = $('#fNext').hidden = n < 2;
  $('#fPrev').disabled = !s.page; $('#fNext').disabled = s.page >= n - 1;
  $('#previewNote').textContent = s.kind === 'filters'
    ? (layout === 'port' ? 'Anteprima: le indicazioni dei tasti in basso le disegna il dispositivo, sul bordo dei tasti.' : 'Le fasce libere ai lati ospitano le indicazioni dei tasti, disegnate dal dispositivo.')
    : 'Anteprima a 1 bit, identica a ciò che vedrai sull\'e-paper.';
}
function turnPage(d) {
  const s = selectedScreen(); if (!s || s.kind !== 'lenschart') return;
  page = Math.max(0, Math.min(lensPages().length - 1, s.page + d)); drawPreview();
}

function renderList() {
  const ul = $('#list'); ul.innerHTML = '';
  const pages = lensPages().length;
  const item = (num, title, detail, to, off) => {
    const on = to.kind === sel.kind && to.i === sel.i;
    ul.append(h('li', { class: (on ? 'sel ' : '') + (off ? 'off' : '') },
      h('button', { class: 'scr', 'aria-current': on ? 'true' : null, title: off ? 'Non inclusa nell\'esportazione' : null, onclick: () => selectScreen(to) },
        h('span', { class: 'n' }, num), h('span', { class: 't' }, title), h('span', { class: 'd' }, detail))));
  };
  item('◆', 'Lens chart', `${plural(state.lenses.length, 'lente', 'lenti')}${pages > 1 ? ` · ${pages} pag.` : ''}`, { kind: 'lenschart' }, !state.auto.lenschart || !state.lenses.length);
  item('◆', 'Filtri', 'ND, diottrie, stadi', { kind: 'filters' }, !state.auto.filters);
  state.cards.forEach((c, i) => item(String(i + 1).padStart(2, '0'), cardTitle(c), TYPE_LABEL[c.type], { kind: 'card', i }));
}
// Sceglie una schermata; nella striscia (sotto i 1100 px) la porta in vista.
function selectScreen(to) {
  sel = to; refresh();
  const b = $('#list li.sel .scr'); if (!b) return;
  b.focus({ preventScroll: true });
  const row = $('.scr-row');
  if (row.scrollWidth > row.clientWidth) row.scrollTo({ left: b.offsetLeft - (row.clientWidth - b.offsetWidth) / 2, behavior: 'smooth' });
}

function changed(redrawEditor = false) { save(); renderList(); drawPreview(); if (simOn) renderSim(); if (redrawEditor) renderEditor(); }

// ---------- editor: lens chart ----------
function lensEditor(ed) {

    h('label', { class: 'fld' }, h('span', { class: 'lab' }, 'Titolo (es. nome produzione)'),

    toggle('Prime e zoom su pagine separate', state.lensSplit, v => { state.lensSplit = v; changed(true); },
      { tip: 'Prima le pagine dei prime, poi quelle degli zoom. Ogni gruppo ha la sua misura del testo: utile con tanti prime e pochi zoom.' }),
    toggle('Mostra il diametro frontale (Ø)', state.lensFront, v => { state.lensFront = v; changed(); },
      { tip: 'Senza il diametro restano focale, T e MOD, più grandi.' }));

        h('div', { class: 'foc', title: `${l.brand} ${l.series}` },
          h('span', { class: out.has(l.uid) ? 'out' : '' }, focalText(e)),
          isModified(l) ? h('span', { class: 'mod', title: 'Dati modificati rispetto alla scheda del costruttore' }, '*') : null,
          h('span', { class: 'ser' }, l.series)),
        h('input', { type: 'text', 'aria-label': 'Sigla', value: l.seriesCode || '', maxlength: 5, oninput: ev => { l.seriesCode = ev.target.value.toUpperCase(); changed(); } }),
        h('select', { 'aria-label': 'Negativo', onchange: ev => { l.highlight = ev.target.value; changed(true); } },
          ...[['auto', 'auto'], ['on', 'sempre'], ['off', 'mai']].map(([v, t]) => h('option', { value: v, selected: (l.highlight || 'auto') === v }, t))),
        h('button', { class: 'small' + (editingUid === l.uid ? ' on' : ''), title: 'Modifica dati', 'aria-label': 'Modifica dati', onclick: () => { editingUid = editingUid === l.uid ? null : l.uid; renderEditor(); } }, '✎'),

    }
    rows.push(h('div', { class: 'acts' },
      h('button', { class: 'small danger', onclick: () => { if (confirm('Togliere tutte le lenti?')) { state.lenses = []; changed(true); } } }, 'Togli tutte')));
  }
  ed.append(section('lens.sel', 'Lenti selezionate', state.lenses.length ? `${state.lenses.length}${nPages > 1 ? ` · ${nPages} pagine` : ''}` : 'nessuna', rows, true,
    { tip: 'In negativo va la lente "fuori dal coro": serie diversa dal set principale o tipo diverso (es. l\'unica macro).' }));

  // Database
  const db = [];

  else {
    const brands = [...new Set(lensDb.map(l => l.brand))].sort();

    const fb = h('select', { 'aria-label': 'Marca' }, h('option', { value: '' }, 'Tutte le marche'), ...brands.map(b => h('option', { value: b, selected: dbSearch.brand === b }, b)));
    const ft = h('select', { 'aria-label': 'Tipo' }, h('option', { value: '' }, 'Tutti i tipi'), ...Object.entries(LENS_TYPES).map(([k, v]) => h('option', { value: k, selected: dbSearch.type === k }, v)));
    const box = h('div', { class: 'db' });
    // searching = l'utente ha appena cambiato la ricerca: se resta una sola serie si apre da sola.

  db.push(section('lens.manual', 'Aggiungi una lente a mano', null, [
    h('div', { class: 'two' }, inp('brand', 'Marca'), inp('series', 'Serie')),
    h('div', { class: 'three mt' }, inp('seriesCode', 'Sigla'), inp('focal', 'Focale mm', 'number'), inp('tstop', 'T', 'number')),
    h('div', { class: 'three mt' }, inp('mod_m', 'MOD m', 'number'), inp('front_mm', 'Ø mm', 'number'),
      h('select', { 'aria-label': 'Tipo', onchange: e => m.type = e.target.value }, ...Object.entries(LENS_TYPES).map(([k, v]) => h('option', { value: k }, v)))),
    h('div', { class: 'acts' }, h('button', { class: 'primary', onclick: () => {
      if (!m.focal) { alert('Serve almeno la focale.'); return; }
      const num = v => v === '' ? null : Number(v);
      state.lenses.push({ uid: 'm-' + Date.now(), dbId: null, brand: m.brand || 'Manuale', series: m.series || m.brand || 'Manuale',
        seriesCode: (m.seriesCode || slug(m.series).slice(0, 3)).toUpperCase(), type: m.type, focal: num(m.focal), focalMin: null, focalMax: null,
        tstop: num(m.tstop), tstopLong: null, mod_m: num(m.mod_m), front_mm: num(m.front_mm), filterThread: null, squeeze: null, highlight: 'auto' });
      changed(true);
    } }, 'Aggiungi'))], false, { sub: true }));
  ed.append(section('lens.db', 'Database lenti', lensDb ? `${lensDb.length} lenti` : null, db, true,
    { tip: 'Dati dalle schede tecniche dei costruttori; "—" = dato non pubblicato in modo affidabile.' }));

  // Modifiche locali: valgono per tutte le produzioni; si portano su un altro computer con un file.
  const nOvr = Object.keys(lensOverrides).length;
  const ovrFile = h('input', { type: 'file', accept: 'application/json', hidden: true, onchange: ev => {
    const file = ev.target.files[0]; if (!file) return;

      h('button', { class: 'small', disabled: !nOvr, onclick: () => download(new Blob([JSON.stringify({ version: 1, overrides: lensOverrides }, null, 2)], { type: 'application/json' }), 'camtag-lenti-modificate.json') }, 'Esporta modifiche'),
      h('button', { class: 'small', onclick: () => ovrFile.click() }, 'Importa modifiche'), ovrFile), false,
    { tip: 'Con ✎ cambi i dati di un esemplare (es. un anello frontale diverso dal noleggio). Il database resta quello del costruttore; i valori modificati sono segnati con * anche sulla lens chart.' }));
}

// Modifica dei dati tecnici di una lente. Lenti del database: modifica locale
// per id, con il valore della scheda accanto. Lenti manuali: si cambiano e basta.
function lensDataEditor(l, e) {
  const base = l.dbId && lensById.get(l.dbId);
  const box = h('div', {});
  const grid = h('div', { class: 'three' });
  for (const [k, label, type] of OVR_FIELDS) {
    const cur = e[k] ?? '';
    const differs = base && lensOverrides[l.dbId] && k in lensOverrides[l.dbId];
    grid.append(h('label', { class: 'fld' },
      h('span', { class: 'lab' }, label, differs ? h('span', { class: 'out' }, `scheda: ${base[k] ?? '—'}`) : null),
      h('input', { type, step: 'any', value: cur, onchange: ev => {
        if (base) setOverride(l.dbId, k, ev.target.value, type);
        else l[k] = ev.target.value === '' ? null : type === 'number' ? Number(ev.target.value) : ev.target.value;
        changed(true);
      } })));
  }
  box.append(grid);
  if (base) {
    const note = (lensOverrides[l.dbId] || {}).note || '';
    box.append(h('label', { class: 'fld' }, h('span', { class: 'lab' }, 'Nota (es. "anello frontale 114 mm del noleggio")'),
      h('input', { type: 'text', value: note, onchange: ev => {
        const o = { ...(lensOverrides[l.dbId] || {}) };
        if (ev.target.value.trim()) o.note = ev.target.value.trim(); else delete o.note;
        if (Object.keys(o).length) lensOverrides[l.dbId] = o; else delete lensOverrides[l.dbId];
        saveOverrides(); changed(true);
      } })),
      h('div', { class: 'acts' },
        h('button', { class: 'small', disabled: !lensOverrides[l.dbId], onclick: () => { delete lensOverrides[l.dbId]; saveOverrides(); changed(true); } }, 'Ripristina i dati della scheda'),
        info('La modifica vale per questa lente in tutte le produzioni.')));
  }
  return box;
}

// Re-rendering the editor resets the results list; keep its scroll position.
function keepScroll(fn) {
  const box = document.querySelector('.db'), top = box ? box.scrollTop : 0;
  fn();
  const nb = document.querySelector('.db'); if (nb) nb.scrollTop = top;
}

function addDbLens(l) {
  if (state.lenses.some(x => x.dbId === l.id)) return;
  const { id, brand, series, seriesCode, type, focal, focalMin, focalMax, tstop, tstopLong, stopType, mod_m, front_mm, filterThread, squeeze } = l;
  state.lenses.push({ uid: 'db-' + id, dbId: id, brand, series, seriesCode, type, focal, focalMin, focalMax, tstop, tstopLong, stopType, mod_m, front_mm, filterThread, squeeze, highlight: 'auto' });
}

// Ricerca senza accenti né maiuscole ("ange" trova "Angénieux"); virgola e punto decimali si equivalgono.
function searchFold(s) { return (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/,/g, '.'); }
function renderDbResults(box, query, brand, type, searching = false) {
  box.innerHTML = '';
  const terms = searchFold(query).split(/\s+/).filter(Boolean);
  const hits = lensDb.filter(l => {
    if (brand && l.brand !== brand) return false;
    if (type && l.type !== type) return false;
    const hay = searchFold(`${l.brand} ${l.series} ${l.name} ${l.seriesCode} ${LENS_TYPES[l.type] || ''} ${focalText(l)} ${focalText(l)}mm`);
    return terms.every(t => hay.includes(t));
  });
  if (!hits.length) { box.append(h('div', { class: 'empty' }, 'Nessuna lente trovata')); return; }
  const groups = new Map();
  for (const l of hits) { const k = `${l.brand} ${l.series}`; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(l); }
  const chosen = new Set(state.lenses.map(l => l.dbId));
  if (searching && groups.size === 1) dbOpen.add(groups.keys().next().value);
  // Le serie sono richiuse: un clic sull'intestazione mostra le focali. Se ne possono aprire più insieme.
  const toggle = name => {
    dbOpen.has(name) ? dbOpen.delete(name) : dbOpen.add(name);
    const top = box.scrollTop; renderDbResults(box, query, brand, type); box.scrollTop = top;
  };
  // Serie in ordine alfabetico (marca, poi serie), senza badare a maiuscole e accenti.
  const sorted = [...groups].sort(([a], [b]) => a.localeCompare(b, 'it', { sensitivity: 'base', numeric: true }));
  for (const [name, ls] of sorted) {
    ls.sort((a, b) => focalSort(a) - focalSort(b));
    const missing = ls.filter(l => !chosen.has(l.id)), open = dbOpen.has(name);
    box.append(h('div', { class: 'grp' },

function renderFilterResults(box, searching = false) {
  const f = state.filters, { q, brand, cat } = fltSearch;
  box.innerHTML = '';
  const terms = searchFold(q).split(/\s+/).filter(Boolean);
  const hits = filterDb.filter(x => {
    if (brand && (x.brand || 'Generico') !== brand) return false;
    if (cat && x.category !== cat) return false;
    const hay = searchFold(`${x.brand} ${x.name} ${x.category} ${x.strengths.join(' ')}`);
    return terms.every(t => hay.includes(t));
  });
  if (!hits.length) { box.append(h('div', { class: 'empty' }, 'Nessun vetro trovato')); return; }
  if (searching && hits.length === 1) fltOpen.add(hits[0].id);
  const toggle = id => {
    fltOpen.has(id) ? fltOpen.delete(id) : fltOpen.add(id);
    const top = box.scrollTop; renderFilterResults(box); box.scrollTop = top;
  };
  const add = (x, list) => { const had = f.effects.some(e => e.id === x.id), e = addToKit(f, x.id, x.name, list); if (!had && x.slots === 2) e.slots = 2; keepScroll(() => changed(true)); };
  // In ordine alfabetico, ma colore e degradanti (usati meno) in fondo.
  const late = x => (FILTER_LATE.includes(x.category) ? 1 : 0);
  const sorted = [...hits].sort((a, b) => late(a) - late(b) || `${a.brand} ${a.name}`.localeCompare(`${b.brand} ${b.name}`, 'it', { sensitivity: 'base', numeric: true }));
  for (const x of sorted) {
    const e = f.effects.find(y => y.id === x.id), have = new Set(e ? e.strengths.map(y => y.s) : []);
    const all = x.strengths.length ? x.strengths : [''], missing = all.filter(s => !have.has(s)), open = fltOpen.has(x.id);
    box.append(h('div', { class: 'grp' },
      h('button', { class: 'tog', 'aria-expanded': String(open), onclick: () => toggle(x.id) },
        h('span', {}, `${x.brand ? x.brand + ' ' : ''}${x.name}`), h('span', { class: 'n' }, x.category)),
      h('button', { class: 'small', disabled: !missing.length, onclick: () => add(x, missing) }, missing.length ? (all.length > 1 ? `+ tutte (${missing.length})` : '+') : 'aggiunto')));
    if (!open) continue;
    for (const st of all) box.append(h('div', { class: 'it' }, h('span', {}, st || 'senza gradazione'),
      have.has(st) ? h('button', { class: 'small', disabled: true }, '✓') : h('button', { class: 'small', onclick: () => add(x, [st]) }, '+')));
  }

// ---------- editor: schede manuali ----------
// Un evento solo per campo: `input` mentre scrivi, `change` per menu e interruttori.
function field(c, label, key, type = 'text', opts) {
  if (type === 'checkbox') return h('div', { class: 'sw-row' }, toggle(label, !!c[key], v => { c[key] = v; changed(); }));
  let el;
  if (type === 'textarea') el = h('textarea');
  else if (type === 'select') el = h('select', {}, ...opts.map(([v, t]) => h('option', { value: v }, t)));
  else el = h('input', { type });
  el.value = c[key] ?? '';
  el.addEventListener(type === 'select' ? 'change' : 'input', () => { c[key] = type === 'number' ? Number(el.value) : el.value; changed(); });
  return h('label', { class: 'fld' }, h('span', { class: 'lab' }, label), el);
}

function moveCard(d) {
  if (sel.kind !== 'card') return; const i = sel.i, j = i + d;
  if (j < 0 || j >= state.cards.length) return;
  [state.cards[i], state.cards[j]] = [state.cards[j], state.cards[i]]; sel = { kind: 'card', i: j }; save(); refresh();
}
function dupCard() {
  if (sel.kind !== 'card') return;
  state.cards.splice(sel.i + 1, 0, structuredClone(state.cards[sel.i])); sel = { kind: 'card', i: sel.i + 1 }; save(); refresh();
}
function delCard() {
  if (sel.kind !== 'card' || !confirm(`Eliminare «${cardTitle(state.cards[sel.i])}»?`)) return;
  state.cards.splice(sel.i, 1); sel = state.cards.length ? { kind: 'card', i: Math.max(0, sel.i - 1) } : { kind: 'lenschart' }; save(); refresh();
}

function downscale(url, max = 1000) {
  return new Promise(res => {
    const im = new Image(); im.onload = () => {
      const s = Math.min(1, max / Math.max(im.width, im.height));
      const [cv] = newCanvas(Math.round(im.width * s), Math.round(im.height * s));
      cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
      res(cv.toDataURL('image/jpeg', 0.85));
    }; im.src = url;
  });
}
function ensureImg(url) {
  if (!url || imgCache.has(url)) return Promise.resolve();
  return new Promise(res => { const im = new Image(); im.onload = () => { imgCache.set(url, im); res(); }; im.onerror = res; im.src = url; });
}
