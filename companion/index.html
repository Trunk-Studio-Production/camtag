// ============================================================================
// Invio via Bluetooth LE (Web Bluetooth). Protocollo: docs/bluetooth.md.
// Sull'X3: tieni premuto F per la ricezione. Manda gli stessi file dello zip.
// ============================================================================
const PROJECT_FILE = 'project.json';  // in /camtag, accanto alle card
const BLE = {
  service: 'c4a70001-1b2e-4f3a-9d6e-3a7c5e0b2f10',
  ctrl: 'c4a70002-1b2e-4f3a-9d6e-3a7c5e0b2f10',
  data: 'c4a70003-1b2e-4f3a-9d6e-3a7c5e0b2f10',
  version: 2,        // protocollo: docs/bluetooth.md
  window: 8192,      // byte in volo non ancora confermati (il dispositivo ne tiene 16 KB)
  ackEvery: 2048,    // GET: il client conferma ogni 2 KB ricevuti
  timeoutMs: 15000,
};
const BLE_ERRORS = {
  CRC: 'I dati sono arrivati rovinati. Riprova.',
  SD: 'Il dispositivo non riesce a scrivere sulla microSD (piena, protetta o assente?).',
  OVERFLOW: 'I dati sono arrivati troppo in fretta. Riprova.',
  STATO: 'Errore di protocollo. Riprova.',
  DATI: 'Errore di protocollo. Riprova.',
  COMANDO: 'Il dispositivo non capisce il comando: aggiorna il firmware.',
  ASSENTE: 'Sull\'X3 non c\'è un progetto. Ci arriva la prossima volta che gli invii le card da questo strumento.',
};

function crc32(bytes, crc = 0) {
  if (!crc32.t) crc32.t = Uint32Array.from({ length: 256 }, (_, n) => { for (let k = 0; k < 8; k++) n = n & 1 ? 0xEDB88320 ^ (n >>> 1) : n >>> 1; return n >>> 0; });
  crc = ~crc;
  for (let i = 0; i < bytes.length; i++) crc = crc32.t[(crc ^ bytes[i]) & 255] ^ (crc >>> 8);
  return ~crc >>> 0;
}

// Supporto di Web Bluetooth: messaggio per chi non ce l'ha.
function bleSupportNote() {
  if (!window.isSecureContext) return 'Serve una pagina in HTTPS (o localhost): il Bluetooth dal browser non funziona su http.';
  if (!navigator.bluetooth) {
    const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    return ios ? 'Safari e gli altri browser di iPhone non hanno il Bluetooth per le pagine web. Apri questa pagina in un browser con Web Bluetooth, per esempio BLE Link o Bluefy.'
      : 'Questo browser non ha il Bluetooth per le pagine web. Usa Chrome o Edge (su Android, Mac, Windows o Linux).';
  }
  return '';
}

let bleRun = null;  // trasferimento in corso: { cancel() }

function bleUi(msg, { detail = '', progress = null, error = false, busy = false } = {}) {
  $('#bleMsg').textContent = msg;
  $('#bleMsg').classList.toggle('err', error);

// Collegamento con l'X3: requestDevice va chiamato subito, dentro il clic (il
// browser lo permette solo in risposta a un gesto). `work` riceve il canale già
// salutato con HELLO; il collegamento si chiude comunque alla fine.
async function bleSession(work, onFail) {
  const devicePromise = navigator.bluetooth.requestDevice({ filters: [{ services: [BLE.service] }, { namePrefix: 'CAMTAG' }], optionalServices: [BLE.service] });
  let device;
  try { device = await devicePromise; } catch (e) { bleUi('Nessun dispositivo scelto.', { detail: 'Sull\'X3 tieni premuto F finché compare BLUETOOTH, poi riprova.' }); return; }
  let cancelled = false, disconnected = false, waiter = null;
  const link = { acked: 0, inbox: [], rx: [], rxBytes: 0, device };
  const wake = () => { if (waiter) { const w = waiter; waiter = null; w(); } };
  link.waitFor = async cond => {
    const t0 = Date.now();
    while (!cond()) {
      if (cancelled) throw new Error('Annullato.');
      if (disconnected) throw new Error('Collegamento interrotto. Avvicina il telefono all\'X3 e riprova.');
      const left = BLE.timeoutMs - (Date.now() - t0);
      if (left <= 0) throw new Error('Il dispositivo non risponde. Riprova.');
      await new Promise(res => { waiter = res; setTimeout(res, Math.min(left, 500)); });
    }
  };
  link.next = async () => {
    await link.waitFor(() => link.inbox.length);
    const m = link.inbox.shift();
    if (m.startsWith('ERR')) { const e = new Error(BLE_ERRORS[m.slice(4)] || `Errore del dispositivo: ${m}`); e.code = m.slice(4); throw e; }
    return m;
  };
  const enc = new TextEncoder(), dec = new TextDecoder();
  let ctrl, data;
  link.cmd = c => (ctrl.writeValueWithResponse ? ctrl.writeValueWithResponse(enc.encode(c)) : ctrl.writeValue(enc.encode(c)));
  link.write = chunk => (data.writeValueWithoutResponse ? data.writeValueWithoutResponse(chunk) : data.writeValue(chunk));
  link.connected = () => !!ctrl && !disconnected;
  link.cancelled = () => cancelled;
  bleRun = { cancel: () => { cancelled = true; wake(); } };
  device.addEventListener('gattserverdisconnected', () => { disconnected = true; wake(); });

  try {
    link.open = async () => {
      bleUi(`Mi collego a ${device.name || 'CamTag'}…`, { busy: true, progress: 0 });
      const server = await device.gatt.connect();
      const svc = await server.getPrimaryService(BLE.service);
      const c = await svc.getCharacteristic(BLE.ctrl);
      data = await svc.getCharacteristic(BLE.data);
      c.addEventListener('characteristicvaluechanged', e => {
        const m = dec.decode(e.target.value);
        if (m.startsWith('ACK ')) link.acked = +m.slice(4); else link.inbox.push(m);
        wake();
      });
      // Pacchetti di un file chiesto con GET.
      data.addEventListener('characteristicvaluechanged', e => {
        const v = e.target.value;
        link.rx.push(new Uint8Array(v.buffer.slice(v.byteOffset, v.byteOffset + v.byteLength)));
        link.rxBytes += v.byteLength;
        wake();
      });
      await c.startNotifications();
      ctrl = c;
      // HELLO: versione del protocollo e MTU. Se l'MTU non è ancora negoziato (23),
      // si riprova una volta dopo poco; i pacchetti sono grandi MTU − 3.
      let mtu = 23;
      for (let i = 0; i < 2 && mtu <= 23; i++) {
        if (i) await new Promise(r => setTimeout(r, 600));
        await link.cmd('HELLO');
        const h = (await link.next()).split(' ');
        if (h[1] !== 'CAMTAG') throw new Error('Il dispositivo non è un CamTag.');
        if (+h[2] !== BLE.version) throw new Error('Versione del firmware diversa da quella dello strumento: aggiornali insieme.');
        mtu = +h[4] || 23;
      }
      link.chunkSize = Math.max(20, Math.min(512, mtu - 3));
      link.dataNotify = () => data.startNotifications();
    };
    await work(link);
  } catch (e) {
    onFail(e, link);
  } finally {
    bleRun = null;
    if (device.gatt.connected) device.gatt.disconnect();
  }
}

// Invio: le stesse cartelle dello zip, project.json compreso.
async function bleSend() {
  await bleSession(async link => {
    bleUi('Preparo le card…', { busy: true, progress: 0 });
    const zip = await buildZip(), files = [];
    for (const [name, entry] of Object.entries(zip.files)) {
      if (entry.dir || !name.startsWith('camtag/')) continue;
      files.push({ path: name.slice(7), bytes: await entry.async('uint8array') });
    }
    if (!files.some(f => f.path.endsWith('.bmp'))) throw new Error('Non ci sono card da inviare.');
    const total = files.reduce((s, f) => s + f.bytes.length, 0);
    await link.open();

    await link.cmd('BEGIN'); await link.next();
    let sent = 0;
    const t0 = Date.now();
    for (const [i, f] of files.entries()) {
      bleUi(`Invio ${i + 1} di ${files.length}…`, { busy: true, progress: sent / total, detail: `${f.path} · ${Math.round(sent / 1024)} di ${Math.round(total / 1024)} KB` });
      await link.cmd(`FILE ${f.bytes.length} ${crc32(f.bytes).toString(16)} ${f.path}`);
      const r = await link.next();
      if (r.startsWith('DONE')) continue;  // file vuoto
      link.acked = 0;
      for (let off = 0; off < f.bytes.length; off += link.chunkSize) {
        await link.waitFor(() => off - link.acked < BLE.window || link.inbox.length);
        if (link.inbox.length) await link.next();  // un ERR interrompe qui
        await link.write(f.bytes.subarray(off, off + link.chunkSize));
        $('#bleBar').value = (sent + off) / total;
      }
      const done = await link.next();
      if (!done.startsWith('DONE')) throw new Error(`Risposta inattesa: ${done}`);
      sent += f.bytes.length;
    }
    bleUi('Salvo sul dispositivo…', { busy: true, progress: 1 });
    await link.cmd('COMMIT'); await link.next();
    const secs = Math.max(1, Math.round((Date.now() - t0) / 1000));
    bleUi('Fatto: le card e il progetto sono sull\'X3.', { progress: 1, detail: `${files.length} file, ${Math.round(total / 1024)} KB in ${secs} s.` });
  }, async (e, link) => {
    if (link.connected()) { try { await link.cmd('ABORT'); } catch {} }
    const c = link.cancelled();
    bleUi(c ? 'Invio annullato: sul dispositivo restano le card di prima.' : e.message || String(e), { error: !c, detail: c ? '' : 'Sul dispositivo restano le card di prima.' });
  });
}

// Importazione: GET del project.json salvato con le card. Il client conferma
// con ACK ogni 2 KB (come fa l'X3 quando riceve) e controlla il CRC.
async function bleGet() {
  let project = null;
  await bleSession(async link => {
    await link.open();
    await link.dataNotify();
    await link.cmd(`GET ${PROJECT_FILE}`);
    const head = (await link.next()).split(' ');
    if (head[0] !== 'FILE') throw new Error(`Risposta inattesa: ${head.join(' ')}`);
    const size = +head[1], crc = parseInt(head[2], 16);
    let acked = 0;
    while (acked < size) {
      await link.waitFor(() => link.rxBytes - acked >= BLE.ackEvery || link.rxBytes >= size);
      if (link.rxBytes > size) throw new Error('Il dispositivo ha mandato più dati del previsto. Riprova.');
      acked = link.rxBytes;
      await link.cmd(`ACK ${acked}`);
      bleUi('Ricevo il progetto…', { busy: true, progress: acked / size, detail: `${Math.round(acked / 1024)} di ${Math.round(size / 1024)} KB` });
    }
    const bytes = new Uint8Array(size);
    let off = 0;
    for (const r of link.rx) { bytes.set(r, off); off += r.length; }
    if (crc32(bytes) !== crc) throw new Error('I dati sono arrivati rovinati. Riprova.');
    try { project = JSON.parse(new TextDecoder().decode(bytes)); } catch { throw new Error('Il progetto sull\'X3 non è leggibile.'); }
    if (!project || !Array.isArray(project.cards)) throw new Error('Il progetto sull\'X3 non è leggibile.');
  }, (e, link) => {
    project = null;
    const c = link.cancelled();
    bleUi(c ? 'Importazione annullata.' : e.message || String(e), { error: !c, detail: c ? '' : 'Il progetto in questo browser non è cambiato.' });
  });
  if (!project) return;
  const when = project.savedAt ? new Date(project.savedAt).toLocaleString('it-IT', { dateStyle: 'medium', timeStyle: 'short' }) : 'in data sconosciuta';
  const name = project.production ? `«${project.production}», ` : '';
  if (!confirm(`Sull'X3 c'è il progetto ${name}inviato ${when}.\n\nSostituisce quello di questo browser: se ti serve il lavoro attuale, prima usa "Salva progetto".`)) {
    bleUi('Importazione annullata: il progetto in questo browser non è cambiato.');
    return;
  }
  await applyProject(project);
  bleUi('Fatto: il progetto dell\'X3 è nello strumento.', { detail: `${project.cards.length} schede manuali, ${project.lenses?.length || 0} lenti.` });
}

// ============================================================================
// Simulatore: dispositivo con i tasti, comportamento previsto per il firmware
// ============================================================================
// rot = rotazione fisica del dispositivo in gradi, in senso orario (0 = verticale, tasti in basso).
const sim = { i: 0, rot: 0, locked: false, lockRot: 0, asleep: false, nd: null, ndShown: 0, dio: null, dioShown: 0, stages: [], sig: '', msg: '' };
let simOn = false;

function simPlan() { return exportPlan(); }
function simContentRot() { return sim.locked ? sim.lockRot : sim.rot; }
// Funzione di un tasto dei bilancieri (A|B, C|D) secondo la schermata e il verso.
// - Nella schermata filtri ogni bilanciere comanda il valore che gli sta accanto:
//   A|B = diottria e C|D = ND, scambiati quando il dispositivo è ruotato di 90°
//   in senso orario (A|B finisce in alto, accanto all'ND).
// - "+" sta sempre sul capo che vedi in alto o a destra (90° e 180°: il primo tasto).
// Fuori dai filtri i bilancieri non fanno nulla, tranne sulla lens chart (lensPageDir).
// Restituisce { role: 'nd' | 'dio' | null, dir: +1 | -1 }.
function rockerAction(k, isFilters, rot) {
  if (!'ABCD'.includes(k)) return { role: null, dir: 0 };
  const rocker = k === 'A' || k === 'B' ? 1 : 2;
  const first = k === 'A' || k === 'C';
  const plusFirst = rot === 90 || rot === 180;
  const dir = first === plusFirst ? 1 : -1;
  if (!isFilters) return { role: null, dir };
  const f = state.filters;
  const near = rot === 90 ? { 1: 'nd', 2: 'dio' } : { 1: 'dio', 2: 'nd' };
  let role = near[rocker];
  if (role === 'dio' && !f.dio.length) role = null;
  if (role === 'nd' && !f.nd.length) role = null;
  return { role, dir };
}
// Lens chart con più pagine: A–D sfogliano solo le sue pagine, in ciclo. I due tasti
// di un bilanciere fanno la stessa cosa: avanza il bilanciere che chi guarda vede a
// destra o in basso, arretra quello a sinistra o in alto. A|B sta a sinistra a 0°,
// in alto a 90°, a destra a 180°, in basso a 270°. Restituisce +1 o -1.
function lensPageDir(k, rot) {
  const ab = k === 'A' || k === 'B', abForward = rot === 180 || rot === 270;
  return ab === abForward ? 1 : -1;
}
function rockerHint(k, rot) {
  const a = rockerAction(k, true, rot);
  return a.role === 'nd' ? `${a.dir > 0 ? '+' : '-'}ND` : a.role === 'dio' ? `${a.dir > 0 ? '+' : '-'}DIO` : '';
}

// ---------- Modifica degli stadi del mattebox ----------
// Si entra tenendo A o B nella schermata filtri; si esce con E o F, o tenendo
// di nuovo A o B (o da soli dopo EDIT_TIMEOUT_S). Lo stadio selezionato
// è in negativo sulla stessa schermata: A/B cambiano stadio, C/D cambiano vetro.
// Gli stadi di ND e diottria non si selezionano; un vetro da due stadi si seleziona intero.
const EDIT_TIMEOUT_S = 5;  // senza tocchi la modifica è accettata e si esce da soli
let simEditTimer = 0;
// Direzione "+" del tasto (in alto o a destra per chi guarda), come in rockerAction.
function keyDir(k, rot) { const first = k === 'A' || k === 'C'; return first === (rot === 90 || rot === 180) ? 1 : -1; }
// A|B scorrono gli stadi: col bilanciere orizzontale "+" (destra) = stadio successivo,
// col bilanciere verticale "+" (in alto) = stadio precedente.
function editNavStep(k, rot) { return (rot % 180 === 0 ? 1 : -1) * keyDir(k, rot); }
function editHint(k, rot) {
  if (k === 'A' || k === 'B') return editNavStep(k, rot) > 0 ? '▼' : '▲';
  return keyDir(k, rot) > 0 ? '+' : '−';
}

function simEditPress(k, long) {
  const ed = sim.edit, st = sim.stages;
  if (k === 'E' || k === 'F' || (long && (k === 'A' || k === 'B'))) { sim.edit = null; sim.msg = 'Stadi salvati.'; return; }
  if (k === 'A' || k === 'B') {
    const ok = editableStages(st, sim.ndShown, sim.dioShown);
    ed.i = ok[Math.max(0, Math.min(ok.length - 1, ok.indexOf(ed.i) + editNavStep(k, sim.rot)))];
  } else if (k === 'C' || k === 'D') {
    // Vuoto, poi i vetri liberi del kit che ci stanno; in fondo si ricomincia.
    const opts = stageOptions(ed.i, st, stageRange(st.length, sim.ndShown, sim.dioShown).hi), j = opts.indexOf(st[ed.i]);
    st[ed.i] = opts[(j + keyDir(k, sim.rot) + opts.length) % opts.length];
  }
}
function simEditArm() {
  clearTimeout(simEditTimer);
  if (sim.edit) simEditTimer = setTimeout(() => { sim.edit = null; sim.msg = `Stadi salvati: ${EDIT_TIMEOUT_S} secondi senza tocchi.`; renderSim(); }, EDIT_TIMEOUT_S * 1000);
}

// ND e diottria cambiano subito nei riquadri grandi; gli stadi si riordinano (ND
// nei primi, diottria negli ultimi, vetri che si stringono: fitStages) solo quando
// i valori restano fermi, così passare da una coppia o da una diottria mentre scorri
// non sposta nulla. sim.ndShown, sim.dioShown = i passi già applicati agli stadi.
const SETTLE_S = 2;
let simSettleTimer = 0;
function simSettle() {
  clearTimeout(simSettleTimer);
  if (sim.ndShown === sim.nd && sim.dioShown === sim.dio) return;
  const was = ndUsed(sim.ndShown), now = ndUsed(sim.nd), dioNew = sim.dioShown !== sim.dio;
  sim.ndShown = sim.nd; sim.dioShown = sim.dio;
  if (!stageCount()) return;
  const { lo, hi } = stageRange(sim.stages.length, sim.nd, sim.dio), names = new Map(kitGlasses().map(g => [g.key, g.label]));
  const r = fitStages(sim.stages, lo, hi, Math.max(0, was - now));
  const noDio = dioUsed(sim.dio) && hi === sim.stages.length ? 'La diottria non entra negli stadi: resta solo nel riquadro grande.' : '';
  if (r.out.length) sim.msg = `Non c'è posto per tutti: ${r.out.map(k => names.get(k)).join(', ')} ${r.out.length > 1 ? 'escono' : 'esce'} dagli stadi.`;
  else if (r.moved) sim.msg = now < was ? (now ? 'Un ND in meno: i vetri tornano accanto all\'ND.' : 'ND tolto: i vetri tornano verso la lente.')
    : now > was ? 'L\'ND prende il suo posto: i vetri scalano verso il fronte.' : 'La diottria prende gli ultimi stadi: i vetri scalano verso la lente.';
  else if (dioNew && noDio) sim.msg = noDio;
}

function simPress(k, long) {
  const plan = simPlan(), cur = plan[sim.i] || plan[0], isFilters = cur?.kind === 'filters';
  // Qualsiasi tasto che non sia ±ND o ±diottria applica subito il riordino in sospeso.
  if (!(isFilters && !sim.edit && !sim.asleep && !(long && (k === 'A' || k === 'B')) && rockerAction(k, true, sim.rot).role)) simSettle();
  if (k === 'P') { sim.asleep = !sim.asleep; sim.edit = null; sim.msg = sim.asleep ? 'Spento: l\'e-paper resta visibile. Power per riaccendere.' : 'Acceso.'; return renderSim(); }
  if (sim.asleep) { sim.msg = 'È spento: solo il power lo riaccende.'; return renderSim(); }
  if (!plan.length) return;
  if (sim.edit) { sim.msg = ''; simEditPress(k, long); simEditArm(); return renderSim(); }
  if (isFilters && long && (k === 'A' || k === 'B')) {
    if (!stageCount()) { sim.msg = 'Nessun vetro nel kit: aggiungili nello strumento web.'; return renderSim(); }
    const ok = editableStages(sim.stages, sim.ndShown, sim.dioShown);
    if (!ok.length) { sim.msg = 'Tutti gli stadi sono occupati da ND e diottria.'; return renderSim(); }
    sim.edit = { i: ok[0] }; sim.msg = `Modifica stadi: A/B stadio, C/D vetro. Si chiude da sola dopo ${EDIT_TIMEOUT_S} s, o subito con E o F.`; simEditArm();
    return renderSim();
  }
  const act = rockerAction(k, isFilters, sim.rot);
  const step = d => { sim.i = (sim.i + d + plan.length) % plan.length; };
  sim.msg = '';
  if (k === 'E' && long) {
    sim.locked = !sim.locked; sim.lockRot = sim.rot;
    sim.msg = sim.locked ? 'ROTAZIONE BLOCCATA' : 'ROTAZIONE AUTOMATICA';
  } else if (k === 'F' && long) {
    sim.msg = 'BLUETOOTH: in attesa dello strumento ("Bluetooth"). E o F per uscire.';
  } else if (act.role === 'dio' || act.role === 'nd') {
    if (act.role === 'dio') sim.dio = Math.max(0, Math.min(dioSteps().length - 1, sim.dio + act.dir));
    else sim.nd = Math.max(0, Math.min(ndSteps().length - 1, sim.nd + act.dir));
    clearTimeout(simSettleTimer);
    simSettleTimer = setTimeout(() => { sim.msg = ''; simSettle(); renderSim(); }, SETTLE_S * 1000);
  } else if (cur.kind === 'lenschart' && 'ABCD'.includes(k)) {
    const lens = plan.map((p, i) => (p.kind === 'lenschart' ? i : -1)).filter(i => i >= 0);
    if (lens.length < 2) sim.msg = 'La lens chart ha una sola pagina: A–D non fanno nulla. Le schermate si cambiano con E e F.';
    else sim.i = lens[(lens.indexOf(sim.i) + lensPageDir(k, sim.rot) + lens.length) % lens.length];
  } else if (k === 'E') step(1);       // E (lato destro) = pagina successiva, in ciclo
  else if (k === 'F') step(-1);        // F (lato sinistro) = pagina precedente
  else sim.msg = 'Nessuna funzione per questo tasto qui: le pagine si cambiano con E e F.';
  renderSim();
}

function renderSim() {
  const plan = simPlan(), f = state.filters;
  // Se cambiano i filtri nello strumento, il dispositivo riparte dai valori iniziali.
  const sig = JSON.stringify(f);
  if (sig !== sim.sig) { sim.sig = sig; sim.nd = Math.min(f.previewNd, ndSteps().length - 1); sim.dio = Math.min(f.previewDio, dioSteps().length - 1); sim.stages = [...f.stages]; sim.ndShown = sim.nd; sim.dioShown = sim.dio; clearTimeout(simSettleTimer); }
  if (sim.i >= plan.length) sim.i = 0;
  const dev = $("#simDevice"), cv = $('#simScreen'), ctx = cv.getContext('2d');
  dev.style.transform = `rotate(${sim.rot}deg)`;
  dev.classList.toggle('asleep', sim.asleep);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
  const item = plan[sim.i];
  if (sim.edit && (item?.kind !== 'filters' || !stageCount())) sim.edit = null;
  if (sim.edit) {
    const ok = editableStages(sim.stages, sim.ndShown, sim.dioShown);
    if (!ok.length) sim.edit = null; else if (!ok.includes(sim.edit.i)) sim.edit.i = ok.findLast(i => i < sim.edit.i) ?? ok[0];
  }
  if (!item) {
    ctx.fillStyle = '#000'; ctx.textAlign = 'center'; ctx.font = `700 28px ${FONT}`;
    ctx.fillText('NESSUNA CARD', cv.width / 2, cv.height / 2);
  } else {
    // Come il firmware: variante adatta al verso; se manca, l'altra ruotata di -90°.
    let angle = simContentRot();
    let layout = angle % 180 === 90 ? 'land' : 'port';
    const avail = item.kind === 'card' ? layoutsOf(item.card) : ['land', 'port'];
    if (!avail.includes(layout)) { layout = layout === 'land' ? 'port' : 'land'; angle = (angle + 270) % 360; }
    const r = renderScreen(item, layout, { preview: true, noHints: true, nd: sim.nd, ndStages: sim.ndShown, dio: sim.dio, dioStages: sim.dioShown, stages: sim.stages, sel: sim.edit ? sim.edit.i : -1 });
    const [tmp, tctx] = newCanvas(r.w, r.h), img = tctx.createImageData(r.w, r.h);
    for (let i = 0; i < r.w * r.h; i++) { const c = r.bits[i] ? 255 : 0; img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = c; img.data[i * 4 + 3] = 255; }
    tctx.putImageData(img, 0, 0);
    ctx.save(); ctx.translate(cv.width / 2, cv.height / 2); ctx.rotate(-angle * Math.PI / 180);
    ctx.drawImage(tmp, -r.w / 2, -r.h / 2); ctx.restore();
    // Indicazioni sul bordo dei tasti (fisso), con il testo dritto per chi guarda.
    if (item.kind === 'filters') {
      for (const k of ['A', 'B', 'C', 'D']) {
        const t = sim.edit ? editHint(k, sim.rot) : rockerHint(k, sim.rot); if (!t) continue;
        ctx.save(); ctx.translate(KEY_POS[k] * cv.width, cv.height - STRIP.port / 2); ctx.rotate(-sim.rot * Math.PI / 180);
        ctx.font = `700 15px ui-monospace, Menlo, monospace`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        const w = ctx.measureText(t).width + 10;
        ctx.fillStyle = '#fff'; ctx.fillRect(-w / 2, -11, w, 22); ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5; ctx.strokeRect(-w / 2, -11, w, 22);
        ctx.fillStyle = '#000'; ctx.fillText(t, 0, 1); ctx.restore();
      }
    }
  }
  const name = sim.edit ? 'Filtri · modifica stadi' : item ? (item.kind === 'lenschart' ? `Lens chart${plan.filter(p => p.kind === 'lenschart').length > 1 ? ` ${item.page + 1}` : ''}` : item.kind === 'filters' ? 'Filtri' : cardTitle(item.card)) : '—';
  $('#simStatus').textContent = [`${sim.i + 1}/${plan.length} · ${name}`, sim.locked ? 'rotazione bloccata' : '', sim.asleep ? 'spento' : '', sim.msg].filter(Boolean).join(' · ');
}

// remember = scelta dell'utente, da ricordare in camtag.ui.v1 (non quando è la finestra stretta a decidere).
function setMode(mode, remember = true) {
  simOn = mode === 'sim';
  document.querySelectorAll('[data-mode]').forEach(x => { x.classList.toggle('on', x.dataset.mode === mode); x.setAttribute('aria-pressed', String(x.dataset.mode === mode)); });
  $('#previewMode').hidden = $('#previewTools').hidden = simOn; $('#simMode').hidden = $('#simTools').hidden = !simOn;
  if (remember) { ui.mode = mode; saveUi(); }
  if (simOn) renderSim(); else drawPreview();
  fitStage();
}
document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => setMode(b.dataset.mode));
// Se la finestra diventa stretta come un telefono si torna all'anteprima; quando si
// riallarga torna il simulatore, se era quello scelto.
const phoneMq = matchMedia('(max-width: 699px)');
const leaveSimOnPhone = () => { if (phoneMq.matches === simOn && (simOn || ui.mode === 'sim')) setMode(simOn ? 'preview' : 'sim', false); };
phoneMq.addEventListener('change', leaveSimOnPhone);
addEventListener('resize', leaveSimOnPhone);
if (ui.mode === 'sim' && !phoneMq.matches) setMode('sim', false);
$('#rotL').onclick = () => { sim.rot = (sim.rot + 270) % 360; sim.msg = ''; renderSim(); };
$('#rotR').onclick = () => { sim.rot = (sim.rot + 90) % 360; sim.msg = ''; renderSim(); };
// Come sul dispositivo: la pressione lunga scatta allo scadere del tempo, con il
// tasto ancora giù, e il rilascio che segue non conta; quella breve al rilascio.
// Maiusc = pressione lunga subito. simHold: tasto giù → timer (0 = nessuno, -1 = già scattata).
const LONG_PRESS_MS = 800, simHold = {};
const simCanHold = k => 'EF'.includes(k) || ('AB'.includes(k) && simPlan()[sim.i]?.kind === 'filters');
const simKeyEl = k => document.querySelector(`#simDevice .key[data-key="${k}"]`);
function simDown(k, shift) {
  if (k in simHold) return;
  simKeyEl(k).classList.add('down');
  const fire = () => { simHold[k] = -1; simKeyEl(k).classList.add('held'); simPress(k, true); };
  simHold[k] = 0;
  if (shift) fire(); else if (simCanHold(k)) simHold[k] = setTimeout(fire, LONG_PRESS_MS);
}
function simUp(k, cancel) {
  if (!(k in simHold)) return;
  const t = simHold[k];
  clearTimeout(t); delete simHold[k]; simKeyEl(k).classList.remove('down', 'held');
  if (t !== -1 && !cancel) simPress(k, false);
}
document.querySelectorAll('#simDevice .key').forEach(b => {
  const k = b.dataset.key;
  b.addEventListener('pointerdown', e => simDown(k, e.shiftKey));
  b.addEventListener('pointerup', () => simUp(k));
  b.addEventListener('pointerleave', () => simUp(k, true));
  b.addEventListener('pointercancel', () => simUp(k, true));
});
const simKeyOf = e => { const k = e.key.toUpperCase(); return k.length === 1 && 'ABCDEFP'.includes(k) ? k : ''; };
document.addEventListener('keydown', e => {
  if (!simOn || e.repeat || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  const k = simKeyOf(e);
  if (k) { e.preventDefault(); simDown(k, e.shiftKey); }
});
document.addEventListener('keyup', e => { const k = simKeyOf(e); if (k) simUp(k, !simOn); });

// Database: servito dalla radice del repo (python3 -m http.server), quindi ../data/.
Promise.all([
  fetch('../data/lenses.json').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(d => { lensDb = d.lenses; lensById = new Map(lensDb.map(l => [l.id, l])); }).catch(() => { lensDbError = 'Database lenti non trovato. Avvia il server dalla radice del progetto: python3 -m http.server 8765, poi apri /companion/.'; }),
  fetch('../data/filters.json').then(r => r.json()).then(d => { filterDb = d.filters; }).catch(() => {}),
  ...state.cards.map(c => ensureImg(c.img)),
  // Il canvas non aspetta i web font: vanno caricati prima di disegnare, altrimenti
  // esce il font di riserva. Tutti i pesi usati dai disegni.
  ...[400, 600, 700, 800, 900].map(w => document.fonts.load(`${w} 40px "Inter"`).catch(() => {})),
]).then(refresh);
refresh();
fitStage();
</script>
</body>
</html>
