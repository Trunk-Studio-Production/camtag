<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CamTag Cards</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root {
    --bg: #f4f3ef; --panel: #ffffff; --ink: #161616; --muted: #6b6b66; --line: #dcdad3;
    --accent: #161616; --accent-ink: #ffffff; --sel: #ecebe5; --danger: #a3261a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121212; --panel: #1c1c1b; --ink: #ecebe6; --muted: #9a9993; --line: #33332f;
      --accent: #ecebe6; --accent-ink: #121212; --sel: #2a2a27; --danger: #e0705f;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121212; --panel: #1c1c1b; --ink: #ecebe6; --muted: #9a9993; --line: #33332f;
    --accent: #ecebe6; --accent-ink: #121212; --sel: #2a2a27; --danger: #e0705f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .04em; }
  header .sp { flex: 1; }
  header select { width: auto; }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 7px 12px; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.danger { color: var(--danger); }
  button.small { padding: 3px 8px; font-size: 12px; }
  button.on { background: var(--sel); border-color: var(--ink); }
  button:disabled { opacity: .35; cursor: default; }
  main { display: grid; grid-template-columns: 220px minmax(0, 1fr) 430px; gap: 16px; padding: 16px; align-items: start; }
  @media (max-width: 1100px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; min-width: 0; }
  .panel h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 10px; }
  .panel h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 18px 0 8px; border-top: 1px solid var(--line); padding-top: 14px; }
  #list { list-style: none; margin: 0 0 10px; padding: 0; }
  #list li { display: flex; gap: 8px; align-items: center; padding: 7px 8px; border-radius: 6px; cursor: pointer; }
  #list li.sel { background: var(--sel); }
  #list li.off .t { text-decoration: line-through; color: var(--muted); }
  #list li .n { color: var(--muted); font-variant-numeric: tabular-nums; width: 20px; }
  #list li .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #list li .k { font-size: 11px; color: var(--muted); }
  .add { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .stage { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .frame { background: #8a8a85; padding: 14px; border-radius: 14px; max-width: 100%; }
  canvas#preview { display: block; max-width: 100%; max-height: 72vh; height: auto; width: auto; image-rendering: pixelated; background: #fff; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: center; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  label.inline { display: inline-flex; gap: 6px; align-items: center; margin: 0; color: var(--ink); font-size: 13px; }
  input[type=text], input[type=number], input[type=search], textarea, select { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px; }
  textarea { min-height: 110px; resize: vertical; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .three { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .hint { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
  .warn { font-size: 12px; color: var(--danger); margin: 8px 0 0; }
  .empty { color: var(--muted); padding: 14px 0; text-align: center; }
  table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.t td, table.t th { padding: 4px 4px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
  table.t th { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; }
  table.t td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.t input, table.t select { padding: 3px 5px; font-size: 12px; }
  .out { background: var(--ink); color: var(--panel); padding: 0 4px; border-radius: 3px; }
  .db { max-height: 420px; overflow: auto; border: 1px solid var(--line); border-radius: 6px; margin-top: 8px; }
  .db .grp { display: flex; align-items: center; gap: 8px; padding: 6px 8px; background: var(--sel); position: sticky; top: 0; font-weight: 600; font-size: 13px; }
  .db .grp span { flex: 1; }
  .db .it { display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-top: 1px solid var(--line); font-size: 13px; }
  .db .it span { flex: 1; font-variant-numeric: tabular-nums; }
  .db .it .meta { color: var(--muted); font-size: 12px; flex: 2; }
  .checks { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px 10px; }
  details summary { cursor: pointer; font-size: 13px; margin-top: 12px; }
  .kit { border: 1px solid var(--line); border-radius: 6px; padding: 8px; margin-top: 8px; }
  .kit-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 13px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip { padding: 4px 10px; border-radius: 999px; font-size: 13px; font-variant-numeric: tabular-nums; }
  .chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .chips input { width: 56px; padding: 4px 6px; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>CAMTAG · CARDS</h1>
  <span class="hint" id="dims"></span>
  <span class="sp"></span>
  <select id="decimal" title="Separatore decimale">
    <option value=",">Decimali: 0,9</option>
    <option value=".">Decimali: 0.9</option>
  </select>
  <select id="device" title="Dispositivo">
    <option value="x3">Xteink X3 · 792×528</option>
  </select>
  <button id="importBtn">Importa progetto</button>
  <button id="exportJson">Salva progetto</button>
  <button id="zipBtn" class="primary">Scarica tutto (.zip)</button>
  <input type="file" id="importFile" accept="application/json" hidden>
</header>

<main>
  <section class="panel">
    <h2>Schermate</h2>
    <ul id="list"></ul>
    <div class="add">
      <button data-add="crew">+ Crew</button>
      <button data-add="notes">+ Note</button>
      <button data-add="lens">+ Lente singola</button>
      <button data-add="patch">+ Patch</button>
    </div>
    <p class="hint">Lens chart e Filtri si generano da soli. L'ordine qui è l'ordine sul dispositivo.</p>
  </section>

  <section class="stage">
    <div class="row">
      <button data-view="land">Orizzontale</button>
      <button data-view="port">Verticale</button>
      <span id="pageCtl" class="row"></span>
    </div>
    <div class="frame"><canvas id="preview"></canvas></div>
    <div class="row">
      <button id="up">↑ Su</button>
      <button id="down">↓ Giù</button>
      <button id="dup">Duplica</button>
      <button id="del" class="danger">Elimina</button>
      <button id="bmpBtn">Scarica questa immagine</button>
    </div>
    <p class="hint" id="previewNote">Anteprima a 1 bit, identica a ciò che vedrai sull'e-paper.</p>
  </section>

  <section class="panel" id="editor"></section>
</main>

<script>
// ============================================================================
// Costanti e stato
// ============================================================================
const DEVICES = { x3: { w: 792, h: 528 } };
const FONT = '-apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif';
const STORE_KEY = 'camtag.project.v1';
const LENS_ROWS_PER_PAGE = 11;
// Fasce libere sui lati corti (dove stanno i tasti) per le indicazioni del firmware.
const STRIP = { port: 40, land: 64 };
// Posizione dei tasti A, B, C, D lungo il bordo inferiore (verticale), in frazione di larghezza.
const KEY_POS = { A: 0.14, B: 0.44, C: 0.57, D: 0.86 };

const ND_VALUES = [0.3, 0.6, 0.9, 1.2, 1.5, 1.8, 2.1, 2.4];
const DIOPTERS = [0.25, 0.5, 1, 2, 3, 4];
const DIO_LABEL = { 0.25: '+1/4', 0.5: '+1/2', 1: '+1', 2: '+2', 3: '+3', 4: '+4' };
const LENS_TYPES = { prime: 'Fisso', macro: 'Macro', zoom: 'Zoom', anamorphic: 'Anamorfico', probe: 'Probe', specialty: 'Speciale' };

const DEFAULTS = {
  lens:  () => ({ formats: 'both', type: 'lens', brand: 'MARCA', series: 'Serie', focal: '35', tstop: '1.8', mod: '0.35 m', front: '95 mm', thread: '', notes: '' }),
  crew:  () => ({ formats: 'both', type: 'crew', title: 'CAMERA DEPT', lines: 'DOP: Nome Cognome\n1st AC: Nome Cognome\n2nd AC: Nome Cognome\nDIT: Nome Cognome\nGaffer: Nome Cognome' }),
  notes: () => ({ formats: 'both', type: 'notes', title: 'NOTE', body: 'CH 1 Camera\nCH 2 Elettrici\n\nScena 12 — Steadicam' }),
  patch: () => ({ formats: 'both', type: 'patch', img: null, fit: 'contain', dither: 'atkinson', threshold: 128, invert: false, caption: '' }),
};
const TYPE_LABEL = { lens: 'Lente', crew: 'Crew', notes: 'Note', patch: 'Patch' };

function freshState() {
  return {
    version: 2, device: 'x3', decimal: ',', production: '',
    auto: { lenschart: true, filters: true },
    lenses: [],
    filters: { ndFormat: 'density', ndType: 'ND', nd: [0.3, 0.6, 0.9, 1.2, 1.5, 1.8], dio: [], effects: [], previewNd: 0, previewDio: 0 },
    cards: [DEFAULTS.crew()],
  };
}

function migrate(s) {
  if (!s || !Array.isArray(s.cards)) return s;
  for (const c of s.cards) { if (!c.formats) c.formats = 'both'; delete c.orient; delete c.mount; }
  const f = freshState();
  for (const k of ['decimal', 'production', 'auto', 'lenses', 'filters']) if (s[k] === undefined) s[k] = f[k];
  s.filters = Object.assign(f.filters, s.filters);
  if ('ir' in s.filters) { if (s.filters.ir) s.filters.ndType = 'IRND'; delete s.filters.ir; }  // vecchia casella IRND
  // Vecchi "filtri di stile" (un elemento per filtro montato) -> kit con gradazioni montate.
  if (Array.isArray(s.filters.style)) {
    for (const o of s.filters.style) addToKit(s.filters, null, o.name, [o.strength || ''], [o.strength || '']);
    delete s.filters.style;
  }
  s.device = 'x3'; s.version = 2;
  return s;
}

// Kit filtri d'effetto: una voce per famiglia, ogni gradazione può essere montata o no.
// { id, name, strengths: [{ s: '1/4', on: true }] }  — s '' = filtro senza gradazione.
function addToKit(f, id, name, strengths, mounted = []) {
  let e = f.effects.find(x => (id && x.id === id) || (!id && !x.id && x.name === name));
  if (!e) { e = { id, name, strengths: [] }; f.effects.push(e); }
  for (const s of strengths.length ? strengths : ['']) {
    const ex = e.strengths.find(x => x.s === s);
    if (ex) ex.on = ex.on || mounted.includes(s); else e.strengths.push({ s, on: mounted.includes(s) });
  }
  return e;
}
function mountedEffects() {
  return state.filters.effects.flatMap(e => e.strengths.filter(x => x.on).map(x => `${e.name}${x.s ? ' ' + x.s : ''}`));
}

function load() { try { return JSON.parse(localStorage.getItem(STORE_KEY)); } catch { return null; } }
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch {} }

let state = migrate(load()) || freshState();
let sel = { kind: 'lenschart' };
let view = 'land';
let page = 0;
let lensDb = null, lensDbError = '';
let dbSearch = { q: '', brand: '', type: '' };
let filterDb = [];
const imgCache = new Map();

// ============================================================================
// Formattazione
// ============================================================================
function fmt(n, max = 2) {
  if (n === null || n === undefined || n === '') return '—';
  const r = Math.round(Number(n) * 10 ** max) / 10 ** max;
  return String(r).replace('.', state.decimal);
}
function focalText(l) { return l.focal != null ? fmt(l.focal, 1) : `${fmt(l.focalMin, 1)}-${fmt(l.focalMax, 1)}`; }
function focalSort(l) { return l.focal != null ? l.focal : (l.focalMin ?? 0); }
function tText(l) { return l.tstop == null ? '—' : (l.tstopLong ? `${fmt(l.tstop)}-${fmt(l.tstopLong)}` : fmt(l.tstop)); }

function ndLabel(d) {
  if (!d) return '—';
  const stops = Math.round(d / 0.3 * 10) / 10;
  if (state.filters.ndFormat === 'stops') return `${fmt(stops, 1)} stop`;
  if (state.filters.ndFormat === 'factor') return `${state.filters.ndType}${Math.round(2 ** stops)}`;
  return fmt(d, 2);
}
function dioLabel(d) { return d ? `${DIO_LABEL[d.v] || '+' + fmt(d.v)}${d.split ? ' SPLIT' : ''}` : '—'; }
function ndSteps() { return [0, ...[...state.filters.nd].sort((a, b) => a - b)]; }
function dioSteps() { return [null, ...[...state.filters.dio].sort((a, b) => a.v - b.v || a.split - b.split)]; }

function slug(s) {
  return (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-|-$/g, '').toLowerCase().slice(0, 24) || 'card';
}

// ============================================================================
// Lens chart: ordinamento, paginazione, lente "fuori dal coro"
// ============================================================================
// ---------- Modifiche locali alle lenti del database (contratto in data/README.md) ----------
// lenses.json resta com'è (scheda del costruttore); le differenze dell'esemplare
// vivono qui, per id, e valgono per tutte le produzioni.
const OVR_KEY = 'camtag.lensOverrides.v1';
const OVR_FIELDS = [['tstop', 'T', 'number'], ['tstopLong', 'T tele', 'number'], ['mod_m', 'MOD m', 'number'],
                    ['front_mm', 'Ø mm', 'number'], ['filterThread', 'Filetto', 'text'], ['squeeze', 'Squeeze', 'number']];
let lensOverrides = (() => { try { return JSON.parse(localStorage.getItem(OVR_KEY))?.overrides || {}; } catch { return {}; } })();
function saveOverrides() { try { localStorage.setItem(OVR_KEY, JSON.stringify({ version: 1, overrides: lensOverrides })); } catch {} }
let lensById = new Map();
let editingUid = null;

// Valori della scheda + modifiche locali, mantenendo le scelte della produzione (sigla, negativo).
function dbWithOverrides(dbLens) { const o = lensOverrides[dbLens.id]; return o ? { ...dbLens, ...o } : dbLens; }
function effective(l) {
  const base = l.dbId && lensById.get(l.dbId);
  if (!base) return l;
  const tech = {};
  for (const [k] of OVR_FIELDS) tech[k] = base[k];
  return { ...l, ...tech, ...(lensOverrides[l.dbId] || {}) };
}
function isModified(l) { const o = l.dbId && lensOverrides[l.dbId]; return !!o && OVR_FIELDS.some(([k]) => k in o); }

function setOverride(dbId, key, raw, type) {
  const base = lensById.get(dbId); if (!base) return;
  const v = raw === '' ? null : type === 'number' ? Number(raw) : raw;
  const o = { ...(lensOverrides[dbId] || {}) };
  if (v === base[key] || (v === null && base[key] == null)) delete o[key]; else o[key] = v;
  if (Object.keys(o).filter(k => k !== 'note').length || o.note) lensOverrides[dbId] = o; else delete lensOverrides[dbId];
  saveOverrides();
}

function sortedLenses() { return state.lenses.map(effective).sort((a, b) => focalSort(a) - focalSort(b) || (a.seriesCode || '').localeCompare(b.seriesCode || '')); }
function lensPages() {
  const all = sortedLenses(), pages = [];
  for (let i = 0; i < all.length; i += LENS_ROWS_PER_PAGE) pages.push(all.slice(i, i + LENS_ROWS_PER_PAGE));
  return pages;
}
function plurality(items) {
  const m = new Map(); for (const k of items) m.set(k, (m.get(k) || 0) + 1);
  const sorted = [...m.entries()].sort((a, b) => b[1] - a[1]);
  if (!sorted.length || (sorted[1] && sorted[1][1] === sorted[0][1])) return null;  // pareggio: nessun principale
  return sorted[0][0];
}
// Evidenziata se di serie diversa dal set principale o di tipo diverso dal resto.
function outliers() {
  const L = state.lenses, out = new Set();
  const key = l => `${l.brand}|${l.series}`;
  const mainSeries = L.length > 1 ? plurality(L.map(key)) : null;
  const mainType = L.length > 1 ? plurality(L.map(l => l.type || 'prime')) : null;
  for (const l of L) {
    if (l.highlight === 'on') out.add(l.uid);
    else if (l.highlight !== 'off' &&
             ((mainSeries && key(l) !== mainSeries) || (mainType && (l.type || 'prime') !== mainType))) out.add(l.uid);
  }
  return out;
}

// ============================================================================
// Disegno: utilità
// ============================================================================
function fitFont(ctx, text, weight, maxW, maxSize, minSize = 10) {
  let s = Math.round(maxSize);
  for (; s > minSize; s -= 2) { ctx.font = `${weight} ${s}px ${FONT}`; if (ctx.measureText(text).width <= maxW) break; }
  ctx.font = `${weight} ${s}px ${FONT}`;
  return s;
}
function wrap(ctx, text, maxW) {
  const out = [];
  for (const para of String(text).split('\n')) {
    if (!para.trim()) { out.push(''); continue; }
    let line = '';
    for (const word of para.split(/\s+/)) {
      const test = line ? line + ' ' + word : word;
      if (ctx.measureText(test).width > maxW && line) { out.push(line); line = word; } else line = test;
    }
    out.push(line);
  }
  return out;
}
function newCanvas(W, H) {
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  return [cv, ctx];
}
function dims(layout) { const { w, h } = DEVICES[state.device]; return layout === 'port' ? [h, w] : [w, h]; }

// ============================================================================
// Schermata: lens chart
// ============================================================================
function drawLensChart(ctx, W, H, rows, pageIdx, pageCount) {
  const out = outliers();
  const pad = Math.round(W * 0.035);
  const barH = Math.round(H > W ? 64 : 56);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, barH);
  ctx.fillStyle = '#fff'; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  const title = (state.production || 'LENS CHART').toUpperCase();
  fitFont(ctx, title, 800, W * 0.7, barH * 0.5); ctx.fillText(title, pad, barH / 2);
  if (pageCount > 1) { ctx.textAlign = 'right'; ctx.font = `700 ${Math.round(barH * 0.4)}px ${FONT}`; ctx.fillText(`${pageIdx + 1}/${pageCount}`, W - pad, barH / 2); }

  // Righe alte quanto lo spazio permette: poche lenti = testo grande. Tutte le
  // pagine usano la misura della pagina più piena, così la scala non cambia.
  const n = Math.max(1, Math.min(state.lenses.length, LENS_ROWS_PER_PAGE));
  const avail = H - barH - pad * 0.5;
  const tall = (avail / n) >= 120;  // abbastanza spazio: ogni lente su due righe
  const headH = tall ? 0 : Math.round(Math.min(46, Math.max(H > W ? 34 : 28, avail / n * 0.32)));
  const rowH = Math.min((avail - headH - (tall ? pad * 0.4 : 0)) / n, H * 0.45);
  const top = barH + headH + (tall ? pad * 0.4 : 0);
  ctx.fillStyle = '#000'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';

  if (!rows.length) {
    ctx.textAlign = 'center'; ctx.font = `600 ${Math.round(H * 0.045)}px ${FONT}`;
    ctx.fillText('Nessuna lente selezionata', W / 2, top + (H - top) / 2);
    return;
  }
  const code = l => (l.seriesCode || '') + (l.squeeze ? ` ×${fmt(l.squeeze)}` : '');
  const specs = l => [['T', tText(l)], ['MOD m', fmt(l.mod_m)], ['Ø mm', l.front_mm != null ? fmt(l.front_mm, 1) : '—']];
  // Una sola misura per tipo di testo su tutta la pagina: la più grande che entra ovunque.
  const sizeFor = (texts, weight, maxW, maxSize) => Math.min(...texts.map(t => fitFont(ctx, t, weight, maxW, maxSize)));
  const rule = y => { ctx.fillStyle = '#000'; ctx.fillRect(pad, y, W - pad * 2, 1); };
  const inner = W - pad * 2;

  if (tall) {
    // Sopra: focale grande e sigla. Sotto: T, MOD, Ø, con l'etichetta sopra il valore.
    const fs = sizeFor(rows.map(focalText), 900, inner * 0.64 - 20, rowH * 0.42);
    const cs = sizeFor(rows.map(code), 800, inner * 0.32, fs * 0.6);
    const ls = Math.max(14, Math.round(rowH * 0.075));
    const groupW = inner / 3;
    const vs = sizeFor(rows.flatMap(l => specs(l).map(s => s[1])), 800, groupW - 34, rowH * 0.26);
    rows.forEach((l, i) => {
      const y = top + i * rowH, line1 = y + rowH * 0.27;
      const labelY = y + rowH * 0.55, valueY = labelY + ls * 0.6 + vs * 0.62;
      if (i > 0) rule(y);
      ctx.font = `900 ${fs}px ${FONT}`;
      const fw = ctx.measureText(focalText(l)).width;
      if (out.has(l.uid)) { ctx.fillStyle = '#000'; ctx.fillRect(pad, line1 - fs * 0.62, fw + 20, fs * 1.18); ctx.fillStyle = '#fff'; }
      ctx.textAlign = 'left'; ctx.fillText(focalText(l), pad + 10, line1);
      ctx.fillStyle = '#000'; ctx.textAlign = 'right'; ctx.font = `800 ${cs}px ${FONT}`;
      ctx.fillText(code(l), W - pad, line1);
      ctx.textAlign = 'left';
      specs(l).forEach(([k, v], j) => {
        const x = pad + 10 + j * groupW;
        ctx.font = `600 ${ls}px ${FONT}`; ctx.fillText(k.toUpperCase(), x, labelY);
        ctx.font = `800 ${vs}px ${FONT}`; ctx.fillText(v, x, valueY);
      });
    });
    return;
  }

  // Tabella: una riga per lente.
  const cols = [['FOC', 0], ['T', 0.26], ['MOD m', 0.42], ['Ø mm', 0.62], ['SERIE', 0.80]];
  const colX = f => pad + f * inner;
  const gap = 14;
  ctx.font = `700 ${Math.round(headH * 0.5)}px ${FONT}`;
  for (const [t, f] of cols) ctx.fillText(t, colX(f) + (f === 0 ? 8 : 0), barH + headH / 2 + 2);
  ctx.fillRect(pad, top - 2, W - pad * 2, 3);
  const focW = colX(cols[1][1]) - colX(0) - gap;
  const fs = sizeFor(rows.map(focalText), 900, focW - 16, rowH * 0.62);
  const cellW = j => (j + 2 < cols.length ? colX(cols[j + 2][1]) : W - pad) - colX(cols[j + 1][1]) - gap;
  const vs = Math.min(...rows.flatMap(l => [...specs(l).map(s => s[1]), code(l)].map((v, j) => fitFont(ctx, v, 800, cellW(j), rowH * 0.5))));
  rows.forEach((l, i) => {
    const y = top + i * rowH, mid = y + rowH / 2 + 1;
    if (i > 0) rule(y);
    if (out.has(l.uid)) { ctx.fillStyle = '#000'; ctx.fillRect(colX(0), y + 3, focW, rowH - 6); ctx.fillStyle = '#fff'; }
    ctx.font = `900 ${fs}px ${FONT}`; ctx.fillText(focalText(l), colX(0) + 8, mid);
    ctx.fillStyle = '#000'; ctx.font = `800 ${vs}px ${FONT}`;
    [...specs(l).map(s => s[1]), code(l)].forEach((v, j) => ctx.fillText(v, colX(cols[j + 1][1]), mid));
  });
}

// ============================================================================
// Schermata: filtri (sfondo + riquadri dei valori)
// ============================================================================
function filtersLayout(W, H) {
  const port = H > W, s = port ? STRIP.port : STRIP.land;
  // Area utile: tolte le fasce sui lati corti, dove il firmware disegna le indicazioni.
  const area = port ? { x: 0, y: s, w: W, h: H - 2 * s } : { x: s, y: 0, w: W - 2 * s, h: H };
  const pad = 22, barH = port ? 64 : 56;
  const L = { port, area, pad, bar: { x: area.x, y: area.y, w: area.w, h: barH } };
  const hasDio = state.filters.dio.length > 0;
  if (port) {
    let y = area.y + barH + 14;
    const slotH = hasDio ? 130 : 170;
    L.ndLabel = { x: area.x + pad, y }; y += 28;
    L.nd = { x: area.x + pad, y, w: area.w - 2 * pad, h: slotH }; y += slotH + 10;
    if (hasDio) { L.dioLabel = { x: area.x + pad, y }; y += 28; L.dio = { x: area.x + pad, y, w: area.w - 2 * pad, h: slotH }; y += slotH + 10; }
    L.list = { x: area.x + pad, y: y + 8, w: area.w - 2 * pad, h: area.y + area.h - y - 16 };
  } else {
    const colW = Math.round(area.w * 0.5);
    let y = area.y + barH + 12;
    const slotH = hasDio ? 150 : 330;
    L.ndLabel = { x: area.x + pad, y }; y += 28;
    L.nd = { x: area.x + pad, y, w: colW - pad * 1.5, h: slotH }; y += slotH + 8;
    if (hasDio) { L.dioLabel = { x: area.x + pad, y }; y += 28; L.dio = { x: area.x + pad, y, w: colW - pad * 1.5, h: slotH }; }
    L.list = { x: area.x + colW + pad * 0.5, y: area.y + barH + 16, w: area.w - colW - pad * 1.5, h: area.h - barH - 32 };
    L.divider = { x: area.x + colW - 2, y: area.y + barH + 16, h: area.h - barH - 32 };
  }
  for (const k of ['nd', 'dio']) if (L[k]) for (const p of ['x', 'y', 'w', 'h']) L[k][p] = Math.round(L[k][p]);
  return L;
}

function drawFiltersBackground(ctx, W, H) {
  const L = filtersLayout(W, H), f = state.filters;
  ctx.fillStyle = '#000'; ctx.fillRect(L.bar.x, L.bar.y, L.bar.w, L.bar.h);
  ctx.fillStyle = '#fff'; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  fitFont(ctx, 'FILTRI', 800, L.bar.w - L.pad * 2, L.bar.h * 0.5); ctx.fillText('FILTRI', L.bar.x + L.pad, L.bar.y + L.bar.h / 2);
  ctx.fillStyle = '#000'; ctx.textBaseline = 'alphabetic';
  ctx.font = `700 22px ${FONT}`;
  ctx.fillText(f.ndType, L.ndLabel.x, L.ndLabel.y + 20);
  if (L.dio) ctx.fillText('DIOTTRIA', L.dioLabel.x, L.dioLabel.y + 20);
  if (L.divider) ctx.fillRect(L.divider.x, L.divider.y, 3, L.divider.h);
  else ctx.fillRect(L.list.x, L.list.y - 10, L.list.w, 3);

  // Filtri d'effetto: solo quelli montati.
  const items = mountedEffects();
  if (!items.length) {
    ctx.font = `600 20px ${FONT}`; ctx.fillStyle = '#000';
    ctx.fillText('Nessun filtro d\'effetto', L.list.x, L.list.y + 30);
    return L;
  }
  const rowH = Math.min(52, L.list.h / items.length);
  items.forEach((t, i) => {
    const y = L.list.y + i * rowH;
    if (i > 0) ctx.fillRect(L.list.x, y, L.list.w, 1);
    ctx.textBaseline = 'middle';
    fitFont(ctx, t, 800, L.list.w, rowH * 0.55); ctx.fillText(t, L.list.x, y + rowH / 2 + 1);
  });
  return L;
}

// Riquadro di un valore: testo grande centrato su bianco.
function drawTile(ctx, x, y, w, h, text) {
  ctx.fillStyle = '#fff'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#000'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  fitFont(ctx, text, 900, w - 10, text === '—' ? h * 0.35 : h * 0.82);  // "nessuno": un trattino, non una barra
  ctx.fillText(text, x + 4, y + h / 2 + h * 0.04);
}

// Indicazioni dei tasti come le disegnerà il firmware (solo anteprima verticale).
function hintLabels() {
  const h = {};
  if (state.filters.dio.length) { h.A = '-DIO'; h.B = '+DIO'; }
  if (state.filters.nd.length) { h.C = '-ND'; h.D = '+ND'; }
  return h;
}
function drawHintsPreview(ctx, W, H) {
  if (H <= W) return;
  ctx.fillStyle = '#000'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `700 15px ui-monospace, Menlo, monospace`;
  for (const [k, t] of Object.entries(hintLabels())) ctx.fillText(t, KEY_POS[k] * W, H - STRIP.port / 2);
}

// ============================================================================
// Schede manuali (lente singola, crew, note, patch)
// ============================================================================
function drawFocal(ctx, big, x, maxW, maxSize, y, centredOnY) {
  let s = maxSize, bw, mw;
  for (; s > 20; s -= 2) {
    ctx.font = `900 ${s}px ${FONT}`; bw = ctx.measureText(big).width;
    ctx.font = `700 ${Math.round(s * 0.28)}px ${FONT}`; mw = ctx.measureText('mm').width;
    if (bw + 8 + mw <= maxW) break;
  }
  const baseY = centredOnY ? y + s * 0.36 : y + s * 0.78;
  ctx.font = `900 ${s}px ${FONT}`; ctx.fillText(big, x, baseY);
  ctx.font = `700 ${Math.round(s * 0.28)}px ${FONT}`; ctx.fillText('mm', x + bw + 8, baseY);
  return s;
}

function drawLens(ctx, W, H, c) {
  const pad = Math.round(W * 0.045);
  const barH = Math.round(H * 0.17);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, barH);
  ctx.fillStyle = '#fff'; ctx.textBaseline = 'middle';
  const head = `${c.brand}`.toUpperCase();
  fitFont(ctx, head, 800, W * 0.55, barH * 0.5);
  ctx.textAlign = 'left'; ctx.fillText(head, pad, barH / 2);
  ctx.textAlign = 'right'; fitFont(ctx, c.series, 500, W * 0.38, barH * 0.38);
  ctx.fillText(c.series, W - pad, barH / 2);

  ctx.fillStyle = '#000'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  const portrait = H > W;
  const specs = [['T', c.tstop], ['MOD', c.mod], ['Ø FRONTALE', c.front], ['FILETTO FILTRI', c.thread]].filter(s => s[1]);
  const notesH = c.notes ? Math.round(H * 0.11) : 0;

  if (!portrait) {
    const colW = W * 0.58;
    drawFocal(ctx, `${c.focal}`, pad, colW - pad * 1.5, H * 0.55, (barH + (H - barH - notesH) / 2), true);
    const x = colW + pad * 0.5, rowH = (H - barH - notesH - pad) / Math.max(specs.length, 1);
    ctx.fillRect(colW, barH + pad * 0.6, 4, H - barH - notesH - pad * 1.2);
    specs.forEach(([k, v], i) => {
      const y = barH + pad * 0.5 + rowH * i;
      ctx.font = `600 ${Math.round(rowH * 0.22)}px ${FONT}`; ctx.fillText(k, x, y + rowH * 0.32);
      fitFont(ctx, v, 800, W - x - pad, rowH * 0.48); ctx.fillText(v, x, y + rowH * 0.82);
    });
  } else {
    const s = drawFocal(ctx, `${c.focal}`, pad, W - pad * 2, H * 0.28, barH + pad, false);
    const top = barH + pad + s * 0.78 + pad, rowH = (H - top - notesH - pad) / Math.max(specs.length, 1);
    specs.forEach(([k, v], i) => {
      const y = top + rowH * i;
      ctx.fillRect(pad, y, W - pad * 2, 3);
      ctx.font = `600 ${Math.round(rowH * 0.24)}px ${FONT}`; ctx.fillText(k, pad, y + rowH * 0.62);
      ctx.textAlign = 'right'; fitFont(ctx, v, 800, W * 0.6, rowH * 0.5); ctx.fillText(v, W - pad, y + rowH * 0.68); ctx.textAlign = 'left';
    });
  }
  if (c.notes) {
    ctx.fillRect(0, H - notesH, W, 3);
    fitFont(ctx, c.notes, 600, W - pad * 2, notesH * 0.5);
    ctx.textBaseline = 'middle'; ctx.fillText(c.notes, pad, H - notesH / 2 + 2);
  }
}

function drawCrew(ctx, W, H, c) {
  const pad = Math.round(W * 0.045);
  const barH = Math.round(H * 0.15);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, barH);
  ctx.fillStyle = '#fff'; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  fitFont(ctx, (c.title || '').toUpperCase(), 800, W - pad * 2, barH * 0.5);
  ctx.fillText((c.title || '').toUpperCase(), pad, barH / 2);
  const rows = String(c.lines).split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    const i = l.indexOf(':'); return i < 0 ? ['', l] : [l.slice(0, i).trim(), l.slice(i + 1).trim()];
  });
  if (!rows.length) return;
  const cols = rows.length > 6 && W > H ? 2 : 1;
  const perCol = Math.ceil(rows.length / cols);
  const colW = (W - pad * (cols + 1)) / cols;
  const rowH = Math.min((H - barH - pad) / perCol, H * 0.2);
  ctx.fillStyle = '#000';
  rows.forEach(([role, name], i) => {
    const col = Math.floor(i / perCol), r = i % perCol;
    const x = pad + col * (colW + pad), y = barH + pad * 0.5 + r * rowH;
    if (r > 0) ctx.fillRect(x, y, colW, 2);
    ctx.textBaseline = 'alphabetic';
    ctx.font = `600 ${Math.round(rowH * 0.24)}px ${FONT}`;
    ctx.fillText(role.toUpperCase(), x, y + rowH * 0.36);
    fitFont(ctx, name, 800, colW, rowH * 0.42);
    ctx.fillText(name, x, y + rowH * 0.84);
  });
}

function drawNotes(ctx, W, H, c) {
  const pad = Math.round(W * 0.05);
  ctx.fillStyle = '#000'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  let top = pad;
  if (c.title) {
    const s = fitFont(ctx, c.title.toUpperCase(), 900, W - pad * 2, H * 0.12);
    ctx.fillText(c.title.toUpperCase(), pad, top + s * 0.8);
    top += s * 0.8 + pad * 0.5;
    ctx.fillRect(pad, top, W - pad * 2, 4);
    top += pad * 0.6;
  }
  let size = Math.round(H * 0.1), lines;
  for (; size > 14; size -= 2) {
    ctx.font = `600 ${size}px ${FONT}`;
    lines = wrap(ctx, c.body, W - pad * 2);
    if (lines.length * size * 1.25 <= H - top - pad) break;
  }
  ctx.font = `600 ${size}px ${FONT}`;
  lines.forEach((l, i) => ctx.fillText(l, pad, top + size * (i + 1) * 1.25 - size * 0.25));
}

function drawPatch(ctx, W, H, c) {
  const capH = c.caption ? Math.round(H * 0.14) : 0;
  const img = c.img && imgCache.get(c.img);
  if (img) {
    const areaH = H - capH;
    const s = c.fit === 'cover' ? Math.max(W / img.width, areaH / img.height) : Math.min(W / img.width, areaH / img.height);
    const w = img.width * s, h = img.height * s;
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, areaH); ctx.clip();
    ctx.drawImage(img, (W - w) / 2, (areaH - h) / 2, w, h);
    ctx.restore();
  } else {
    ctx.fillStyle = '#000'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `600 ${Math.round(H * 0.06)}px ${FONT}`;
    ctx.fillText('Carica un\'immagine', W / 2, (H - capH) / 2);
  }
  if (c.caption) {
    ctx.fillStyle = '#000'; ctx.fillRect(0, H - capH, W, capH);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    fitFont(ctx, c.caption.toUpperCase(), 800, W * 0.9, capH * 0.55);
    ctx.fillText(c.caption.toUpperCase(), W / 2, H - capH / 2);
  }
}

// ============================================================================
// Rasterizzazione 1 bit e BMP
// ============================================================================
function toBits(ctx, W, H, mode = 'threshold', t = 128) {
  const src = ctx.getImageData(0, 0, W, H).data;
  const g = new Float32Array(W * H);
  for (let i = 0; i < W * H; i++) g[i] = 0.299 * src[i * 4] + 0.587 * src[i * 4 + 1] + 0.114 * src[i * 4 + 2];
  if (mode === 'atkinson') return atkinson(g, W, H);
  if (mode === 'fs') return floyd(g, W, H);
  const b = new Uint8Array(W * H); for (let i = 0; i < g.length; i++) b[i] = g[i] >= t ? 1 : 0; return b;
}
function atkinson(g, W, H) {
  const b = new Uint8Array(W * H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x, old = g[i], nv = old < 128 ? 0 : 255; b[i] = nv ? 1 : 0;
    const e = (old - nv) / 8;
    for (const [dx, dy] of [[1,0],[2,0],[-1,1],[0,1],[1,1],[0,2]]) {
      const xx = x + dx, yy = y + dy; if (xx >= 0 && xx < W && yy < H) g[yy * W + xx] += e;
    }
  }
  return b;
}
function floyd(g, W, H) {
  const b = new Uint8Array(W * H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x, old = g[i], nv = old < 128 ? 0 : 255; b[i] = nv ? 1 : 0;
    const e = old - nv;
    if (x + 1 < W) g[i + 1] += e * 7 / 16;
    if (y + 1 < H) { if (x > 0) g[i + W - 1] += e * 3 / 16; g[i + W] += e * 5 / 16; if (x + 1 < W) g[i + W + 1] += e / 16; }
  }
  return b;
}
// 1-bit BMP: palette 0 = nero, 1 = bianco, righe dal basso, allineate a 4 byte.
function encodeBmp(bits, W, H) {
  const rowBytes = Math.ceil(W / 32) * 4, dataSize = rowBytes * H, off = 62;
  const buf = new ArrayBuffer(off + dataSize), dv = new DataView(buf), u8 = new Uint8Array(buf);
  u8[0] = 0x42; u8[1] = 0x4D; dv.setUint32(2, off + dataSize, true); dv.setUint32(10, off, true);
  dv.setUint32(14, 40, true); dv.setInt32(18, W, true); dv.setInt32(22, H, true);
  dv.setUint16(26, 1, true); dv.setUint16(28, 1, true); dv.setUint32(30, 0, true);
  dv.setUint32(34, dataSize, true); dv.setInt32(38, 2835, true); dv.setInt32(42, 2835, true);
  dv.setUint32(46, 2, true); dv.setUint32(50, 2, true);
  u8.set([0, 0, 0, 0, 255, 255, 255, 0], 54);
  for (let y = 0; y < H; y++) {
    const rowOff = off + (H - 1 - y) * rowBytes;
    for (let x = 0; x < W; x++) if (bits[y * W + x]) u8[rowOff + (x >> 3)] |= 0x80 >> (x & 7);
  }
  return new Blob([buf], { type: 'image/bmp' });
}

// ============================================================================
// Render delle schermate
// ============================================================================
// opts.preview: compone anche valori e indicazioni (per l'anteprima).
function renderScreen(s, layout, opts = {}) {
  const [W, H] = dims(layout);
  const [cv, ctx] = newCanvas(W, H);
  if (s.kind === 'lenschart') {
    const pages = lensPages();
    drawLensChart(ctx, W, H, pages[s.page] || [], s.page, pages.length);
  } else if (s.kind === 'filters') {
    const L = drawFiltersBackground(ctx, W, H);
    if (opts.preview) {
      const f = state.filters;
      drawTile(ctx, L.nd.x, L.nd.y, L.nd.w, L.nd.h, ndLabel(ndSteps()[f.previewNd] || 0));
      if (L.dio) drawTile(ctx, L.dio.x, L.dio.y, L.dio.w, L.dio.h, dioLabel(dioSteps()[f.previewDio] || null));
      drawHintsPreview(ctx, W, H);
    }
  } else {
    const c = s.card;
    ({ lens: drawLens, crew: drawCrew, notes: drawNotes, patch: drawPatch })[c.type](ctx, W, H, c);
    const photo = c.type === 'patch' && c.img && c.dither !== 'none';
    const bits = toBits(ctx, W, H, photo ? c.dither : 'threshold', c.type === 'patch' ? c.threshold : 128);
    if (c.type === 'patch' && c.invert) {
      const end = c.caption ? (H - Math.round(H * 0.14)) * W : W * H;
      for (let i = 0; i < end; i++) bits[i] ^= 1;
    }
    return { bits, w: W, h: H };
  }
  return { bits: toBits(ctx, W, H), w: W, h: H };
}

function renderTileBits(text, w, h) {
  const [, ctx] = newCanvas(w, h);
  drawTile(ctx, 0, 0, w, h, text);
  return toBits(ctx, w, h);
}

function layoutsOf(c) { return c.formats === 'land' ? ['land'] : c.formats === 'port' ? ['port'] : ['land', 'port']; }

// ============================================================================
// Esportazione
// ============================================================================
// Ordine sul dispositivo: lens chart (pagine), filtri, schede manuali.
function exportPlan() {
  const plan = [];
  if (state.auto.lenschart && state.lenses.length)
    lensPages().forEach((_, i) => plan.push({ kind: 'lenschart', page: i, base: i ? `lenschart-${i + 1}` : 'lenschart' }));
  if (state.auto.filters) plan.push({ kind: 'filters', base: 'filters' });
  state.cards.forEach(c => plan.push({ kind: 'card', card: c, base: `${c.type}_${slug(cardTitle(c))}` }));
  plan.forEach((p, i) => p.name = `${String(i + 1).padStart(2, '0')}_${p.base}`);
  return plan;
}

// Descrive al firmware dove comporre i valori e quali tasti li cambiano.
function filtersIni() {
  const out = ['# camtag screen v1', 'type=filters'];
  const nd = ndSteps(), dio = dioSteps();
  out.push(`nd.count=${nd.length}`, `nd.labels=${nd.map(ndLabel).join('|')}`);
  out.push(`dio.count=${state.filters.dio.length ? dio.length : 0}`);
  if (state.filters.dio.length) out.push(`dio.labels=${dio.map(dioLabel).join('|')}`);
  for (const layout of ['land', 'port']) {
    const [W, H] = dims(layout), L = filtersLayout(W, H);
    out.push(`${layout}.nd=${L.nd.x},${L.nd.y},${L.nd.w},${L.nd.h}`);
    if (L.dio) out.push(`${layout}.dio=${L.dio.x},${L.dio.y},${L.dio.w},${L.dio.h}`);
  }
  const keys = [];
  if (state.filters.dio.length) keys.push('A:dio-', 'B:dio+');
  if (state.filters.nd.length) keys.push('C:nd-', 'D:nd+');
  out.push(`keys=${keys.join('|')}`);
  out.push(`hints=${Object.entries(hintLabels()).map(([k, t]) => `${k}:${t}`).join('|')}`);
  out.push(`nd.start=${state.filters.previewNd}`, `dio.start=${state.filters.previewDio}`);
  return out.join('\n') + '\n';
}

async function buildZip() {
  const zip = new JSZip(), dir = zip.folder('camtag');
  for (const p of exportPlan()) {
    if (p.kind === 'card') {
      for (const l of layoutsOf(p.card)) { const r = renderScreen(p, l); dir.file(`${p.name}${l === 'port' ? '.p' : ''}.bmp`, encodeBmp(r.bits, r.w, r.h)); }
      continue;
    }
    for (const l of ['land', 'port']) { const r = renderScreen(p, l); dir.file(`${p.name}${l === 'port' ? '.p' : ''}.bmp`, encodeBmp(r.bits, r.w, r.h)); }
    if (p.kind === 'filters') {
      const sub = dir.folder(p.name);
      sub.file('screen.ini', filtersIni());
      for (const l of ['land', 'port']) {
        const [W, H] = dims(l), L = filtersLayout(W, H), ext = l === 'port' ? '.p.bmp' : '.bmp';
        ndSteps().forEach((v, i) => sub.file(`nd${i}${ext}`, encodeBmp(renderTileBits(ndLabel(v), L.nd.w, L.nd.h), L.nd.w, L.nd.h)));
        if (L.dio) dioSteps().forEach((v, i) => sub.file(`dio${i}${ext}`, encodeBmp(renderTileBits(dioLabel(v), L.dio.w, L.dio.h), L.dio.w, L.dio.h)));
      }
    }
  }
  return zip;
}

// ============================================================================
// Interfaccia
// ============================================================================
const $ = s => document.querySelector(s);
const preview = $('#preview');
function h(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'class') e.className = v;
    else if (v === true) e.setAttribute(k, '');
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null) e.append(k instanceof Node ? k : document.createTextNode(k));
  return e;
}
function cardTitle(c) {
  if (c.type === 'lens') return `${c.focal}mm ${c.brand}`;
  if (c.type === 'crew') return c.title || 'Crew';
  if (c.type === 'notes') return c.title || 'Note';
  return c.caption || 'Immagine';
}
function selectedScreen() {
  if (sel.kind === 'lenschart') return { kind: 'lenschart', page: Math.min(page, Math.max(lensPages().length - 1, 0)) };
  if (sel.kind === 'filters') return { kind: 'filters' };
  const c = state.cards[sel.i]; return c ? { kind: 'card', card: c } : null;
}
function availableLayouts() { const s = selectedScreen(); return s && s.kind === 'card' ? layoutsOf(s.card) : ['land', 'port']; }
function currentLayout() { const l = availableLayouts(); return l.includes(view) ? view : l[0]; }

function drawPreview() {
  const s = selectedScreen(), ctx = preview.getContext('2d');
  if (!s) { preview.width = 792; preview.height = 528; ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, 792, 528); return; }
  const layout = currentLayout(), r = renderScreen(s, layout, { preview: true });
  preview.width = r.w; preview.height = r.h;
  const img = ctx.createImageData(r.w, r.h);
  for (let i = 0; i < r.w * r.h; i++) { const c = r.bits[i] ? 255 : 0; img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = c; img.data[i * 4 + 3] = 255; }
  ctx.putImageData(img, 0, 0);
  document.querySelectorAll('[data-view]').forEach(b => { b.classList.toggle('on', b.dataset.view === layout); b.disabled = !availableLayouts().includes(b.dataset.view); });

  const pc = $('#pageCtl'); pc.innerHTML = '';
  if (s.kind === 'lenschart' && lensPages().length > 1) {
    const n = lensPages().length;
    pc.append(h('button', { class: 'small', disabled: s.page === 0, onclick: () => { page--; drawPreview(); } }, '‹'),
              h('span', { class: 'hint' }, `Pagina ${s.page + 1}/${n}`),
              h('button', { class: 'small', disabled: s.page >= n - 1, onclick: () => { page++; drawPreview(); } }, '›'));
  }
  $('#previewNote').textContent = s.kind === 'filters'
    ? (layout === 'port' ? 'Anteprima: le indicazioni dei tasti in basso le disegna il dispositivo, sul bordo dei tasti.' : 'Le fasce libere ai lati ospitano le indicazioni dei tasti, disegnate dal dispositivo.')
    : 'Anteprima a 1 bit, identica a ciò che vedrai sull\'e-paper.';
  const isCard = s.kind === 'card';
  $('#up').disabled = $('#down').disabled = $('#dup').disabled = $('#del').disabled = !isCard;
}

// Modifica dei dati tecnici di una lente. Lenti del database: modifica locale
// per id, con il valore della scheda accanto. Lenti manuali: si cambiano e basta.
function lensDataEditor(l, e) {
  const base = l.dbId && lensById.get(l.dbId);
  const box = h('div', { style: 'padding:8px 0' });
  const grid = h('div', { class: 'three' });
  for (const [k, label, type] of OVR_FIELDS) {
    const cur = e[k] ?? '';
    const differs = base && lensOverrides[l.dbId] && k in lensOverrides[l.dbId];
    grid.append(h('div', {},
      h('label', {}, label, differs ? h('span', { class: 'out', style: 'margin-left:4px' }, `scheda: ${base[k] ?? '—'}`) : null),
      h('input', { type, step: 'any', value: cur, onchange: ev => {
        if (base) setOverride(l.dbId, k, ev.target.value, type);
        else l[k] = ev.target.value === '' ? null : type === 'number' ? Number(ev.target.value) : ev.target.value;
        changed(true);
      } })));
  }
  box.append(grid);
  if (base) {
    const note = (lensOverrides[l.dbId] || {}).note || '';
    box.append(h('label', {}, 'Nota (es. "anello frontale 114 mm del noleggio")'),
      h('input', { type: 'text', value: note, onchange: ev => {
        const o = { ...(lensOverrides[l.dbId] || {}) };
        if (ev.target.value.trim()) o.note = ev.target.value.trim(); else delete o.note;
        if (Object.keys(o).length) lensOverrides[l.dbId] = o; else delete lensOverrides[l.dbId];
        saveOverrides(); changed(true);
      } }),
      h('div', { class: 'row', style: 'justify-content:flex-start;margin-top:8px' },
        h('button', { class: 'small', disabled: !lensOverrides[l.dbId], onclick: () => { delete lensOverrides[l.dbId]; saveOverrides(); changed(true); } }, 'Ripristina i dati della scheda'),
        h('span', { class: 'hint', style: 'margin:0' }, 'La modifica vale per questa lente in tutte le produzioni.')));
  }
  return box;
}

// Re-rendering the editor resets the results list; keep its scroll position.
function keepScroll(fn) {
  const box = document.querySelector('.db'), top = box ? box.scrollTop : 0;
  fn();
  const nb = document.querySelector('.db'); if (nb) nb.scrollTop = top;
}

function addDbLens(l) {
  if (state.lenses.some(x => x.dbId === l.id)) return;
  const { id, brand, series, seriesCode, type, focal, focalMin, focalMax, tstop, tstopLong, mod_m, front_mm, filterThread, squeeze } = l;
  state.lenses.push({ uid: 'db-' + id, dbId: id, brand, series, seriesCode, type, focal, focalMin, focalMax, tstop, tstopLong, mod_m, front_mm, filterThread, squeeze, highlight: 'auto' });
}

function renderDbResults(box, query, brand, type) {
  box.innerHTML = '';
  const terms = query.toLowerCase().split(/\s+/).filter(Boolean);
  const hits = lensDb.filter(l => {
    if (brand && l.brand !== brand) return false;
    if (type && l.type !== type) return false;
    const hay = `${l.brand} ${l.series} ${l.seriesCode} ${LENS_TYPES[l.type] || ''} ${focalText(l)} ${focalText(l)}mm`.toLowerCase();
    return terms.every(t => hay.includes(t));
  });
  if (!hits.length) { box.append(h('div', { class: 'empty' }, 'Nessuna lente trovata')); return; }
  const groups = new Map();
  for (const l of hits) { const k = `${l.brand} ${l.series}`; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(l); }
  const chosen = new Set(state.lenses.map(l => l.dbId));
  let shown = 0;
  for (const [name, ls] of groups) {
    if (shown > 400) { box.append(h('div', { class: 'empty' }, 'Restringi la ricerca per vedere altre lenti')); break; }
    ls.sort((a, b) => focalSort(a) - focalSort(b));
    const missing = ls.filter(l => !chosen.has(l.id));
    box.append(h('div', { class: 'grp' }, h('span', {}, `${name} · ${ls[0].seriesCode}`),
      h('button', { class: 'small', disabled: !missing.length, onclick: () => { missing.forEach(addDbLens); changed(true); } }, missing.length ? `+ tutte (${missing.length})` : 'aggiunte')));
    for (const l of ls) {
      shown++;
      const v = dbWithOverrides(l);
      const meta = `T${tText(v)} · MOD ${fmt(v.mod_m)} m · Ø ${v.front_mm != null ? fmt(v.front_mm, 1) : '—'}${l.type !== 'prime' ? ' · ' + LENS_TYPES[l.type] : ''}${lensOverrides[l.id] ? ' · modificata' : ''}`;
      box.append(h('div', { class: 'it' }, h('span', {}, `${focalText(l)} mm`), h('span', { class: 'meta' }, meta),
        chosen.has(l.id) ? h('button', { class: 'small', disabled: true }, '✓') :
        h('button', { class: 'small', onclick: () => { addDbLens(l); keepScroll(() => changed(true)); } }, '+')));
    }
  }
}

function field(c, label, key, type = 'text', opts) {
  const wrapEl = h('div', {}, h('label', {}, label));
  let el;
  if (type === 'textarea') el = h('textarea');
  else if (type === 'select') el = h('select', {}, ...opts.map(([v, t]) => h('option', { value: v }, t)));
  else if (type === 'checkbox') el = h('input', { type: 'checkbox', checked: !!c[key] });
  else el = h('input', { type });
  if (type !== 'checkbox') el.value = c[key] ?? '';
  el.oninput = el.onchange = () => { c[key] = type === 'checkbox' ? el.checked : type === 'number' ? Number(el.value) : el.value; changed(); };
  wrapEl.append(el);
  return wrapEl;
}

function cardEditor(ed, c, idx) {
  ed.append(h('h2', {}, TYPE_LABEL[c.type]));
  ed.append(field(c, 'Formati esportati', 'formats', 'select', [['both', 'Orizzontale + verticale (rotazione automatica)'], ['land', 'Solo orizzontale'], ['port', 'Solo verticale']]));
  const pair = (a, b) => ed.append(h('div', { class: 'two' }, a, b));
  if (c.type === 'lens') {
    pair(field(c, 'Marca', 'brand'), field(c, 'Serie', 'series'));
    pair(field(c, 'Focale (mm)', 'focal'), field(c, 'T-stop', 'tstop'));
    pair(field(c, 'MOD (fuoco minimo)', 'mod'), field(c, 'Ø frontale', 'front'));
    ed.append(field(c, 'Filettatura filtri (opzionale, es. M82)', 'thread'));
    ed.append(field(c, 'Nota in basso (opzionale)', 'notes'));
  } else if (c.type === 'crew') {
    ed.append(field(c, 'Titolo', 'title'), field(c, 'Una riga per persona — "Ruolo: Nome"', 'lines', 'textarea'));
  } else if (c.type === 'notes') {
    ed.append(field(c, 'Titolo', 'title'), field(c, 'Testo', 'body', 'textarea'));
  } else {
    const inp = h('input', { type: 'file', accept: 'image/*', onchange: () => {
      const file = inp.files[0]; if (!file) return;
      const r = new FileReader();
      r.onload = () => downscale(r.result).then(url => { c.img = url; return ensureImg(url); }).then(() => changed());
      r.readAsDataURL(file);
    } });
    ed.append(h('label', {}, 'Immagine'), inp);
    pair(field(c, 'Adattamento', 'fit', 'select', [['contain', 'Intera'], ['cover', 'Riempi']]),
         field(c, 'Retinatura', 'dither', 'select', [['atkinson', 'Atkinson'], ['fs', 'Floyd–Steinberg'], ['none', 'Soglia']]));
    ed.append(field(c, 'Soglia (solo "Soglia")', 'threshold', 'number'), field(c, 'Inverti colori', 'invert', 'checkbox'), field(c, 'Didascalia (opzionale)', 'caption'));
  }
}

function renderEditor() {
  const ed = $('#editor'); ed.innerHTML = '';
  if (sel.kind === 'lenschart') return lensEditor(ed);
  if (sel.kind === 'filters') return filtersEditor(ed);
  const c = state.cards[sel.i];
  if (!c) { ed.append(h('div', { class: 'empty' }, 'Seleziona una schermata')); return; }
  cardEditor(ed, c, sel.i);
}

function downscale(url, max = 1000) {
  return new Promise(res => {
    const im = new Image(); im.onload = () => {
      const s = Math.min(1, max / Math.max(im.width, im.height));
      const [cv] = newCanvas(Math.round(im.width * s), Math.round(im.height * s));
      cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
      res(cv.toDataURL('image/jpeg', 0.85));
    }; im.src = url;
  });
}
function ensureImg(url) {
  if (!url || imgCache.has(url)) return Promise.resolve();
  return new Promise(res => { const im = new Image(); im.onload = () => { imgCache.set(url, im); res(); }; im.onerror = res; im.src = url; });
}

function refresh() {
  $('#decimal').value = state.decimal;
  const d = DEVICES[state.device]; $('#dims').textContent = `${d.w}×${d.h} · 1 bit`;
  renderList(); renderEditor(); drawPreview();
}

function download(blob, name) {
  const a = h('a', { href: URL.createObjectURL(blob), download: name });
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

document.querySelectorAll('[data-add]').forEach(b => b.onclick = () => {
  state.cards.push(DEFAULTS[b.dataset.add]()); sel = { kind: 'card', i: state.cards.length - 1 }; save(); refresh();
});
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => { view = b.dataset.view; drawPreview(); });
$('#decimal').onchange = e => { state.decimal = e.target.value; save(); refresh(); };
const moveCard = d => {
  if (sel.kind !== 'card') return; const i = sel.i, j = i + d;
  if (j < 0 || j >= state.cards.length) return;
  [state.cards[i], state.cards[j]] = [state.cards[j], state.cards[i]]; sel = { kind: 'card', i: j }; save(); refresh();
};
$('#up').onclick = () => moveCard(-1);
$('#down').onclick = () => moveCard(1);
$('#dup').onclick = () => { if (sel.kind !== 'card') return; state.cards.splice(sel.i + 1, 0, structuredClone(state.cards[sel.i])); sel = { kind: 'card', i: sel.i + 1 }; save(); refresh(); };
$('#del').onclick = () => { if (sel.kind !== 'card') return; state.cards.splice(sel.i, 1); sel = state.cards.length ? { kind: 'card', i: Math.max(0, sel.i - 1) } : { kind: 'lenschart' }; save(); refresh(); };
$('#bmpBtn').onclick = () => {
  const s = selectedScreen(); if (!s) return;
  const l = currentLayout(), r = renderScreen(s, l, { preview: true });
  const base = s.kind === 'card' ? `${s.card.type}_${slug(cardTitle(s.card))}` : s.kind;
  download(encodeBmp(r.bits, r.w, r.h), `${base}${l === 'port' ? '.p' : ''}.bmp`);
};
$('#zipBtn').onclick = async () => download(await (await buildZip()).generateAsync({ type: 'blob' }), 'camtag.zip');
// Il file di progetto porta con sé le modifiche delle sue lenti, per essere completo su un altro computer.
$('#exportJson').onclick = () => {
  const used = Object.fromEntries(state.lenses.filter(l => l.dbId && lensOverrides[l.dbId]).map(l => [l.dbId, lensOverrides[l.dbId]]));
  download(new Blob([JSON.stringify({ ...state, lensOverrides: used }, null, 2)], { type: 'application/json' }), 'camtag-progetto.json');
};
$('#importBtn').onclick = () => $('#importFile').click();
$('#importFile').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(t => {
    const d = JSON.parse(t);
    if (d.lensOverrides) { Object.assign(lensOverrides, d.lensOverrides); saveOverrides(); delete d.lensOverrides; }
    state = migrate(d); sel = { kind: 'lenschart' }; return Promise.all(state.cards.map(c => ensureImg(c.img))); }).then(() => { save(); refresh(); });
};

// Database: servito dalla radice del repo (python3 -m http.server), quindi ../data/.
Promise.all([
  fetch('../data/lenses.json').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(d => { lensDb = d.lenses; lensById = new Map(lensDb.map(l => [l.id, l])); }).catch(() => { lensDbError = 'Database lenti non trovato. Avvia il server dalla radice del progetto: python3 -m http.server 8765, poi apri /companion/.'; }),
  fetch('../data/filters.json').then(r => r.json()).then(d => { filterDb = d.filters; }).catch(() => {}),
  ...state.cards.map(c => ensureImg(c.img)),
]).then(refresh);
refresh();
</script>
</body>
</html>
