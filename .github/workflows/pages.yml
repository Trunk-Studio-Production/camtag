# Pubblica il configuratore web su GitHub Pages a ogni push su main.
# Il contenuto di companion/ va nella radice del sito e data/ in data/ (nel repo
# la pagina legge ../data/*.json, qui data/*.json), più il firmware compilato
# dallo stesso commit in firmware/camtag.bin, che il configuratore web manda
# all'X3 con "Aggiorna firmware", e l'immagine completa in
# firmware/camtag-factory.bin per la prima installazione via USB (install/).
# I vecchi indirizzi sotto companion/ rimandano ai nuovi.
name: Pages

on:
  push:
    branches: [main]
    paths: [companion/**, data/**, device/**, third_party/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Due job: preparare e caricare l'archivio, poi pubblicarlo. Nello stesso job il
# deploy a volte partiva prima che GitHub avesse registrato l'archivio ("No
# artifacts named github-pages"); il passaggio tra i job gli dà il tempo.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true  # third_party/freeink-sdk
      # Firmware già compilato da un commit con gli stessi device/ e SDK: se c'è,
      # niente PlatformIO né compilazione (una modifica al solo configuratore web
      # si pubblica in pochi secondi). Il controllo della versione resta.
      - id: fw
        uses: actions/cache@v6
        with:
          path: |
            device/.pio/build/x3/firmware.bin
            device/.pio/build/x3/firmware.factory.bin
          key: fw-${{ hashFiles('device/**', 'third_party/**') }}
      - if: steps.fw.outputs.cache-hit != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - if: steps.fw.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ hashFiles('device/platformio.ini') }}
      - name: Compila il firmware
        if: steps.fw.outputs.cache-hit != 'true'
        run: |
          pip install platformio
          cd device && pio run -e x3
      # Il configuratore web si aspetta lo stesso firmware che manda (FW_VERSION):
      # se Version.h e index.html non vanno d'accordo la pubblicazione si ferma.
      - name: Controlla la versione del firmware
        run: |
          bin=$(grep -ao 'CAMTAG_FW=[0-9A-Za-z.-]*' device/.pio/build/x3/firmware.bin | head -1 | cut -d= -f2)
          web=$(grep -o "^const FW_VERSION = '[^']*'" companion/index.html | cut -d"'" -f2)
          echo "firmware $bin, configuratore web $web"
          test -n "$bin" && test "$bin" = "$web"
          # L'immagine completa (bootloader + partizioni + firmware) per install/
          fac=$(grep -ao 'CAMTAG_FW=[0-9A-Za-z.-]*' device/.pio/build/x3/firmware.factory.bin | head -1 | cut -d= -f2)
          test "$fac" = "$web"
      - name: Prepara il sito
        run: |
          mkdir -p _site/firmware
          cp -R companion/. _site/
          cp -R data _site/
          cp device/.pio/build/x3/firmware.bin _site/firmware/camtag.bin
          cp device/.pio/build/x3/firmware.factory.bin _site/firmware/camtag-factory.bin
          # Il commit nella pagina (BUILD) e in build.txt, che la pagina rilegge senza
          # cache per sapere se ne esiste una più nuova; i18n.js con lo stesso ?v.
          # I dati stanno accanto alla pagina, non più un livello sopra.
          sha=${GITHUB_SHA::7}
          sed -i "s/__BUILD__/$sha/; s/src=\"i18n.js\"/src=\"i18n.js?v=$sha\"/; s#\`\.\./data/#\`data/#g" _site/index.html
          grep -q "const BUILD = '$sha'" _site/index.html
          if grep -q '`\.\./data/' _site/index.html; then exit 1; fi
          echo "$sha" > _site/build.txt
          # Vecchi indirizzi (fino a novembre 2026 il sito stava sotto companion/):
          # rimandano allo stesso posto un livello sopra, con ?… e #… intatti.
          # build.txt anche lì: una pagina vecchia rimasta aperta (Bluefy) vede la
          # versione nuova, si ricarica e passa dal rimando.
          mkdir -p _site/companion && cp _site/build.txt _site/companion/build.txt
          for d in "" manual/ manuale/ install/; do
            mkdir -p "_site/companion/$d"
            up=$(echo "companion/$d" | sed 's#[^/]*/#../#g')
            cat > "_site/companion/${d}index.html" <<HTML
          <!doctype html>
          <meta charset="utf-8">
          <title>CamTag</title>
          <link rel="canonical" href="${up}${d}">
          <script>location.replace('${up}${d}' + location.search + location.hash)</script>
          <noscript><meta http-equiv="refresh" content="0; url=${up}${d}"></noscript>
          <a href="${up}${d}">CamTag</a>
          HTML
          done
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true  # .nojekyll

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
