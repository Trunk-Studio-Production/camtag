; CamTag — firmware MVP per Xteink X3 (e X4), basato su FreeInk SDK.
; Build:   pio run -e x3
; Flash:   pio run -e x3 -t upload
; Serial:  pio device monitor

[platformio]
default_envs = x3

[base]
; Stessa piattaforma usata da CrossPoint con questa revisione dell'SDK.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder

; Modulo Xteink: DIO, 16 MB. Tabella partizioni identica a CrossPoint,
; così il flasher web di CrossPoint/Xteink può sempre ripristinare.
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 6553600

build_unflags = -std=gnu++11
build_flags =
  -std=gnu++2a
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
  -DUSE_UTF8_LONG_NAMES=1

lib_deps =
  BoardConfig=symlink://../third_party/freeink-sdk/libs/hardware/BoardConfig
  EInkDisplay=symlink://../third_party/freeink-sdk/libs/display/FreeInkDisplay
  InputManager=symlink://../third_party/freeink-sdk/libs/hardware/InputManager
  BatteryMonitor=symlink://../third_party/freeink-sdk/libs/hardware/BatteryMonitor
  SDCardManager=symlink://../third_party/freeink-sdk/libs/hardware/SDCardManager
  PowerManager=symlink://../third_party/freeink-sdk/libs/hardware/PowerManager
  XteinkDetect=symlink://../third_party/freeink-sdk/libs/hardware/XteinkDetect
  Imu=symlink://../third_party/freeink-sdk/libs/hardware/Imu

; Binario unico X3 + X4 (il dispositivo viene riconosciuto all'avvio).
[env:x3]
extends = base
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X3=1
  -DFREEINK_DEVICE_X4=1
  -DCAMTAG_DEBUG=1
